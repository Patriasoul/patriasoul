<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brigade | PatriaSoul</title><meta name="description" content="Registar brigada Hrvatske vojske iz Domovinskog rata."><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/patriasoul-global.css"><style>.registry{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.registry-card{padding:22px}.registry-card h2{margin:0 0 8px}.meta{color:var(--pt-muted);font-size:13px}.badge{display:inline-block;margin-top:15px;padding:6px 9px;border-radius:999px;border:1px solid var(--pt-line);color:var(--pt-gold2);font-size:11px}.toolbar{margin:26px 0}.toolbar input{width:100%;padding:13px 15px}.empty{padding:35px;text-align:center;color:var(--pt-muted)}@media(max-width:900px){.registry{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.registry{grid-template-columns:1fr}}</style></head><body>
<header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html"><span class="ps-brand-mark">🇭🇷</span> PATRIA<span>SOUL</span></a><nav class="ps-mainnav"></nav><button class="ps-menu" data-ps-menu aria-label="Otvori izbornik">☰</button></div></header>
<main><section class="ps-page-hero"><div class="container"><p>BRANITELJI · HRVATSKA VOJSKA</p><h1>Brigade</h1><p>Gardijske i druge brigade iz središnjeg registra PatriaSoula.</p></div></section><section class="container" style="padding:38px 0 70px"><div class="toolbar"><input id="search" type="search" placeholder="Pretraži brigadu, nadimak, sjedište ili područje…" aria-label="Pretraži brigade"></div><div id="list" class="registry"></div></section></main><footer class="ps-footer"><div class="container"><p>PatriaSoul · Znanje, sjećanje i identitet.</p></div></footer>
<script src="/site-navigation.js"></script><script type="module">import {brigade} from '/brigade.js';const list=document.getElementById('list'),search=document.getElementById('search');function render(){const q=search.value.trim().toLowerCase();const rows=brigade.filter(x=>JSON.stringify(x).toLowerCase().includes(q));list.innerHTML=rows.map(x=>`<article class="registry-card ps-card"><h2>${x.number||''} ${x.name||''}</h2><div class="meta">${x.nickname?'„'+x.nickname+'“ · ':''}${x.type||''}</div><p><strong>Zapovjedno mjesto:</strong> ${x.headquarters||'—'}<br><strong>Područje:</strong> ${x.region||'—'}<br><strong>Razdoblje:</strong> ${x.period||'—'}</p><span class="badge">${x.type||'postrojba'}</span></article>`).join('')||'<div class="empty">Nema rezultata.</div>'}search.addEventListener('input',render);render();</script></body></html>
