<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatriaSoul QA | Test</title><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/patriasoul-global.css"><script src="/site-navigation.js?v=45" defer></script><link rel="stylesheet" href="/portal-editorial-pages.css"><script src="/navigation-ux.js?v=1" defer></script><link rel="stylesheet" href="/patriasoul-image-fields.css">
</head><body><main><section class="ps-page-hero"><div class="container"><span class="ps-kicker">🔧 QA</span><h1>PatriaSoul test centar</h1><p>Automatska provjera jezgre i uredničke pokrivenosti gradova.</p></div></section>
<figure class="ps-image-field ps-auto-image-field"><span class="ps-image-label">GLAVNA SLIKA · PatriaSoul QA | Test</span><img data-ps-image data-ps-image-src="/images/patria-image-placeholder.svg" src="/images/patria-image-placeholder.svg" alt="Glavna slika stranice — zamijeni fotografijom ili ilustracijom" width="1600" height="900"><figcaption>Standardno slikovno polje PatriaSoula. Za zamjenu slike promijeni samo <code>data-ps-image-src</code>; struktura stranice ostaje ista.</figcaption></figure><section class="ps-section"><div class="container"><div id="qa" class="ps-grid ps-grid-3"></div></div></section></main><script src="/patriasoul-profile.js"></script><script src="/levels.js"></script><script src="/badges.js"></script><script src="/quiz.js"></script><script src="/gradovi.js"></script><script src="/gradovi-profil.js"></script><script src="/gradovi-profil-2.js"></script><script src="/gradovi-profil-3.js"></script><script src="/gradovi-profil-4.js"></script><script src="/gradovi-profil-5.js"></script><script src="/gradovi-profil-6.js"></script><script src="/gradovi-profil-7.js"></script><script src="/gradovi-profil-8.js"></script><script src="/gradovi-profil-9.js"></script><script src="/gradovi-profil-10.js"></script><script src="/gradovi-profil-11.js"></script><script>(function(){const out=document.getElementById('qa');const checks=[];function add(name,ok,detail){checks.push({name,ok,detail})}try{const v=PatriaQuiz.validate();add('Quiz schema',v.invalid===0&&v.duplicates===0,`${v.total} pitanja · ${v.invalid} neispravnih · ${v.duplicates} duplikata`)}catch(e){add('Quiz engine',false,e.message)}try{const c=window.PATRIA_CITY_DATA||[];const ids=new Set(c.map(x=>x.slug));add('Gradovi',c.length===127&&ids.size===c.length,`${c.length} gradova · ${ids.size} jedinstvenih slugova`)}catch(e){add('Gradovi',false,e.message)}try{const c=window.PATRIA_CITY_DATA||[];const regs=[window.PATRIA_CITY_EDITORIAL,window.PATRIA_CITY_EDITORIAL_2,window.PATRIA_CITY_EDITORIAL_3,window.PATRIA_CITY_EDITORIAL_4,window.PATRIA_CITY_EDITORIAL_5,window.PATRIA_CITY_EDITORIAL_6,window.PATRIA_CITY_EDITORIAL_7,window.PATRIA_CITY_EDITORIAL_8,window.PATRIA_CITY_EDITORIAL_9,window.PATRIA_CITY_EDITORIAL_10,window.PATRIA_CITY_EDITORIAL_11].filter(Boolean);const owner=new Map();const duplicate=[];for(const reg of regs){for(const name of Object.keys(reg)){if(owner.has(name)) duplicate.push(name);else owner.set(name,true)}}const missing=c.map(x=>x.name).filter(name=>!owner.has(name));const orphan=[...owner.keys()].filter(name=>!c.some(x=>x.name===name));add('Profili gradova',missing.length===0&&duplicate.length===0&&orphan.length===0,`${owner.size}/${c.length} profila · nedostaju: ${missing.length} · duplikati: ${duplicate.length} · profili bez registra: ${orphan.length}`);if(missing.length)console.warn('Nedostaju profili:',missing);if(duplicate.length)console.warn('Dupli profili:',duplicate);if(orphan.length)console.warn('Profili bez kanonskog grada:',orphan)}catch(e){add('Profili gradova',false,e.message)}try{add('100 razina',Array.isArray(PATRIA_LEVELS)&&PATRIA_LEVELS.length===100,`${PATRIA_LEVELS?.length||0} razina`)}catch(e){add('Razine',false,e.message)}try{const p=PatriaPlayer.current();add('Centralni profil',p.version===2&&PatriaPlayer.KEY==='patriasoul_player_v2','Jedan ključ i centralni API')}catch(e){add('Profil',false,e.message)}try{add('Značke',Array.isArray(PATRIA_BADGES)&&PATRIA_BADGES.length>=10,`${PATRIA_BADGES?.length||0} pravila`)}catch(e){add('Značke',false,e.message)}out.innerHTML=checks.map(c=>`<article class="ps-card"><div class="ps-card-icon">${c.ok?'✅':'❌'}</div><h2>${c.name}</h2><p>${c.detail}</p></article>`).join('')})();</script><script src="/patriasoul-image-fields.js" defer></script>
</body></html>
