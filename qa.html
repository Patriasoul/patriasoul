<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatriaSoul QA | Test</title><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/patriasoul-global.css">
<script src="/site-navigation.js" defer></script>
<script src="/page-hero.js" defer></script>
</head><body><main><section class="ps-page-hero"><div class="container"><span class="ps-kicker">🔧 QA</span><h1>PatriaSoul test centar</h1><p>Automatska provjera jezgre prije javnog testiranja.</p></div></section><section class="ps-section"><div class="container"><div id="qa" class="ps-grid ps-grid-3"></div></div></section></main><script src="/patriasoul-profile.js"></script><script src="/levels.js"></script><script src="/badges.js"></script><script src="/quiz.js"></script><script src="/gradovi.js"></script><script>(function(){const out=document.getElementById('qa');const checks=[];function add(name,ok,detail){checks.push({name,ok,detail})}try{const v=PatriaQuiz.validate();add('Quiz schema',v.invalid===0&&v.duplicates===0,`${v.total} pitanja · ${v.invalid} neispravnih · ${v.duplicates} duplikata`)}catch(e){add('Quiz engine',false,e.message)}try{const c=window.PATRIA_CITY_DATA||[];const ids=new Set(c.map(x=>x.slug));add('Gradovi',c.length===127&&ids.size===c.length,`${c.length} gradova · ${ids.size} jedinstvenih slugova`)}catch(e){add('Gradovi',false,e.message)}try{add('100 razina',Array.isArray(PATRIA_LEVELS)&&PATRIA_LEVELS.length===100,`${PATRIA_LEVELS?.length||0} razina`)}catch(e){add('Razine',false,e.message)}try{const p=PatriaPlayer.current();add('Centralni profil',p.version===2&&PatriaPlayer.KEY==='patriasoul_player_v2','Jedan ključ i centralni API')}catch(e){add('Profil',false,e.message)}try{add('Značke',Array.isArray(PATRIA_BADGES)&&PATRIA_BADGES.length>=10,`${PATRIA_BADGES?.length||0} pravila`)}catch(e){add('Značke',false,e.message)}out.innerHTML=checks.map(c=>`<article class="ps-card"><div class="ps-card-icon">${c.ok?'✅':'❌'}</div><h2>${c.name}</h2><p>${c.detail}</p></article>`).join('')})();</script></body></html>
