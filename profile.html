<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PatriaSoul — profil igrača, XP, bodovi i značke."><title>Profil igrača | PatriaSoul</title><link rel="stylesheet" href="patriasoul-modern.css"></head><body><div id="site-header"></div><main><section class="ps-page-hero"><div class="container"><div class="ps-breadcrumbs"><a href="/index.html">Početna</a> / Profil igrača</div><span class="ps-kicker">👤 Igrač</span><h1>Profil igrača</h1><p>Pregled tvog lokalnog napretka. Kada uvedemo online račun, isti profil može postati temelj za globalnu rang-listu i značke.</p></div></section><section class="ps-section"><div class="container"><div class="ps-grid ps-grid-3"><article class="ps-card"><div class="ps-card-icon">⭐</div><h3>XP</h3><p id="xp">0</p></article><article class="ps-card"><div class="ps-card-icon">🏆</div><h3>Bodovi</h3><p id="points">0</p></article><article class="ps-card"><div class="ps-card-icon">🧠</div><h3>Kvizovi</h3><p id="quizzes">0</p></article></div><div class="ps-feature" style="margin-top:20px"><div class="ps-feature-body"><span class="ps-kicker">Profil</span><h2 id="name">PatriaSoul igrač</h2><p id="badges" style="margin-top:10px">Značke će se prikazivati ovdje.</p></div></div></div></section></main><div id="site-footer"></div><script src="app.js" defer></script><script>document.addEventListener('DOMContentLoaded',()=>{try{const p=JSON.parse(localStorage.getItem('patriasoul_player')||'null');if(!p)return;document.getElementById('name').textContent=p.name||'PatriaSoul igrač';document.getElementById('xp').textContent=Number(p.xp)||0;document.getElementById('points').textContent=Number(p.points)||0;document.getElementById('quizzes').textContent=Number(p.quizzes)||0;document.getElementById('badges').textContent=(Array.isArray(p.badges)&&p.badges.length)?p.badges.join(' · '):'Još nema osvojenih znački.'}catch{}});</script></body></html>
