<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatriaSoul – provjera baze</title><link rel="stylesheet" href="patriasoul-modern.css"><style>body{padding:30px}.box{max-width:900px;margin:auto;padding:28px;border:1px solid #303844;border-radius:18px;background:#0b1016}.ok{color:#6fd39a}.bad{color:#ef7b84}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #2b333e;text-align:left}</style></head><body><main class="box"><span class="ps-kicker">PatriaSoul QA</span><h1>Provjera kviz baze</h1><div id="result">Provjera u tijeku…</div></main><script src="quiz.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const v=PATRIA_QUIZ_VALIDATION;const result=document.getElementById('result');const rows=Object.entries(v.byCategory).map(([k,n])=>`<tr><td>${PATRIA_CATEGORIES[k]}</td><td>${n}</td><td>${n===100?'✅':'❌'}</td></tr>`).join('');result.innerHTML=`<h2 class="${v.exact1000?'ok':'bad'}">${v.exact1000?'✅ 100% PROVJERENO':'❌ PROVJERA NIJE PROŠLA'}</h2><p>Ukupno pitanja: <strong>${v.total}</strong></p><p>Kategorije: <strong>${v.categories}</strong></p><p>Neispravna pitanja: <strong>${v.invalid}</strong></p><p>Duplikati ID-a: <strong>${v.duplicates}</strong></p><p>Duplikati teksta pitanja: <strong>${v.duplicateQuestions}</strong></p><p>Status kategorija: <strong>${v.eachCategory100?'10 × 100 ✅':'Nije 10 × 100 ❌'}</strong></p><table><thead><tr><th>Kategorija</th><th>Pitanja</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`});</script></body></html>
