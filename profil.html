<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PatriaSoul profil igrača — XP, razina, statistika i značke."><title>Moj profil | PatriaSoul</title><link rel="stylesheet" href="/patriasoul-modern.css"></head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html"><span class="ps-brand-mark">PS</span>PATRIA<span>SOUL</span></a><nav class="ps-mainnav"><a href="/index.html">Početna</a><a href="/povijest.html">Povijest</a><a href="/gradovi.html">Gradovi</a><a href="/quiz.html">Kviz</a><a href="/brani-svoj-grad.html">Igra</a><a href="/profil.html" aria-current="page">Profil</a></nav><button class="ps-menu" type="button" data-ps-menu>☰</button></div></header><main><section class="ps-page-hero"><div class="container"><span class="ps-kicker">🛡️ PatriaSoul igrač</span><h1>Moj profil</h1><p>Prati svoje znanje, XP, razinu i osvojene značke.</p></div></section><section class="ps-content"><div class="container"><div id="profile" class="ps-grid ps-grid-3"></div></div></section></main><footer class="ps-footer"><div class="container"><div class="ps-footer-bottom"><span>© 2026 PatriaSoul</span><span>Hrvatska. Povijest. Znanje. Identitet.</span></div></div></footer><script src="/xp-engine.js"></script><script src="/levels.js"></script><script src="/badges.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const p=window.PatriaXP?.getProfile?.()||JSON.parse(localStorage.getItem('patriasoul_xp')||'{"xp":0,"points":0,"quizzes":0,"correct":0,"streak":0,"badges":[]}');const levels=window.PATRIA_LEVELS||window.PatriaLevels||[];let level=levels.find((x,i)=>p.xp>=(x.minXP??x.min??0)&&(i===levels.length-1||p.xp<(levels[i+1].minXP??levels[i+1].min??Infinity)))||levels[0];const next=levels[levels.indexOf(level)+1];const pct=next?Math.min(100,Math.round(((p.xp-(level.minXP??level.min??0))/((next.minXP??next.min)- (level.minXP??level.min??0)))*100)):100;const badges=window.PATRIA_BADGES||[];document.getElementById('profile').innerHTML='<div class="ps-card"><div class="ps-card-icon">🏆</div><h2>'+(level?.name||'Početnik')+'</h2><p>'+p.xp+' XP</p><div class="ps-progress"><span style="display:block;width:'+pct+'%;height:8px"></span></div><small>'+(next?('Do '+next.name+': '+((next.minXP??next.min)-p.xp)+' XP'): 'Maksimalna razina')+'</small></div><div class="ps-card"><div class="ps-card-icon">📊</div><h2>Statistika</h2><p>Kvizova: <strong>'+p.quizzes+'</strong></p><p>Točnih odgovora: <strong>'+p.correct+'</strong></p><p>Bodova: <strong>'+p.points+'</strong></p><p>Streak: <strong>🔥 '+p.streak+'</strong></p></div><div class="ps-card"><div class="ps-card-icon">🎖️</div><h2>Značke</h2><p>'+((p.badges||[]).length)+' osvojenih znački</p><div>'+(badges.length?badges.map(b=>'<span title="'+(b.description||'')+'" style="display:inline-block;font-size:28px;margin:4px">'+b.icon+'</span>').join(''):'Još nema osvojenih znački.')+'</div></div></div>');document.querySelector('[data-ps-menu]')?.addEventListener('click',()=>document.querySelector('.ps-mainnav')?.classList.toggle('is-open'));});</script><script src="/ai-engine/puter-ai.js"></script><script src="/ai-engine/pitaj-patriasoul-widget.js"></script></body></html>
