<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pretraživanje sadržaja portala PatriaSoul — Hrvatska, povijest, baština, gradovi, vjera, branitelji i kvizovi.">
  <meta name="theme-color" content="#07090d">
  <title>Pretraži | PatriaSoul</title>
  <link rel="stylesheet" href="patriasoul-modern.css">
  <link rel="stylesheet" href="responsive.css">
  <style>
    .search-page{padding:48px 0 80px}
    .search-hero{max-width:900px;margin:0 auto 34px;text-align:center}
    .search-kicker{color:var(--ps-gold-2);font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
    .search-hero h1{margin:8px 0 10px;font-size:clamp(34px,5vw,58px);line-height:1.05}
    .search-hero p{margin:0;color:var(--ps-muted);font-size:16px}
    .search-box{display:flex;gap:10px;margin:28px auto 0;max-width:820px}
    .search-box input{flex:1;min-width:0;border:1px solid var(--ps-line);border-radius:14px;background:var(--ps-surface);color:var(--ps-text);padding:15px 17px;outline:none;box-shadow:var(--ps-shadow)}
    .search-box input:focus{border-color:rgba(217,184,76,.65);box-shadow:0 0 0 3px rgba(217,184,76,.10)}
    .search-box button{border:0;border-radius:14px;background:var(--ps-gold);color:#111;font-weight:900;padding:0 24px;cursor:pointer}
    .search-box button:hover{background:var(--ps-gold-2)}
    .search-status{max-width:900px;margin:0 auto 18px;color:var(--ps-muted);font-size:14px}
    .search-results{display:grid;gap:14px;max-width:1000px;margin:auto}
    .search-result{display:block;border:1px solid var(--ps-line);border-radius:16px;background:linear-gradient(145deg,var(--ps-surface),rgba(18,24,33,.72));padding:20px 22px;transition:.2s ease}
    .search-result:hover{transform:translateY(-2px);border-color:rgba(217,184,76,.35);box-shadow:var(--ps-shadow)}
    .search-result h2{margin:0 0 5px;font-size:20px;color:var(--ps-gold-2)}
    .search-result .url{font-size:12px;color:#778392;margin-bottom:9px;overflow-wrap:anywhere}
    .search-result p{margin:0;color:#c5ccd5;font-size:14px;line-height:1.65}
    .search-empty{border:1px dashed var(--ps-line);border-radius:16px;padding:34px;text-align:center;color:var(--ps-muted);background:rgba(13,17,24,.7)}
    .search-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:30px;color:var(--ps-muted)}
    .search-spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.16);border-top-color:var(--ps-gold);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* PatriaSoul znak: samo hrvatska šahovnica, bez krune/gornjeg dijela grba. */
    .ps-checker-mark{
      width:34px;height:34px;border:1px solid rgba(217,184,76,.55);border-radius:8px;
      background:
        conic-gradient(#c9212c 25%,#f4f6f8 0 50%,#c9212c 0 75%,#f4f6f8 0) 0 0/40% 40%;
      box-shadow:inset 0 0 0 2px rgba(0,0,0,.18),0 5px 18px rgba(0,0,0,.22);
      flex:0 0 auto;
    }
    .search-brand-text{display:inline-flex;align-items:center;gap:10px}
    .search-brand-text strong{color:#f4f6f8}
    .search-brand-text strong span{color:var(--ps-gold-2)}

    @media (max-width:640px){
      .search-page{padding-top:32px}
      .search-box{flex-direction:column}
      .search-box button{min-height:48px}
      .search-result{padding:17px}
    }
  </style>
<link rel="stylesheet" href="/patriasoul-global.css">
<script src="/site-navigation.js" defer></script>
</head>
<body>
  <div class="ps-topbar">
    <div class="container ps-topbar-inner">
      <span><strong>PatriaSoul</strong> · Hrvatska kroz znanje, baštinu i zajedništvo</span>
      <span aria-hidden="true">🇭🇷</span>
    </div>
  </div>

  <header class="ps-header">
    <div class="container ps-nav">
      <a class="ps-brand" href="index.html" aria-label="PatriaSoul početna stranica">
        <span class="ps-checker-mark" aria-hidden="true"></span>
        <span class="search-brand-text"><strong>PATRIA<span>SOUL</span></strong></span>
      </a>
      <button class="ps-menu" type="button" aria-expanded="false" aria-controls="main-navigation">☰ <span class="sr-only">Izbornik</span></button>
      <nav class="ps-mainnav" id="main-navigation" aria-label="Glavna navigacija">
        <a href="index.html">Početna</a>
        <a href="pages/povijest/index.html">Povijest</a>
        <a href="pages/bastina/index.html">Baština</a>
        <a href="pages/gradovi/index.html">Gradovi</a>
        <a href="pages/vjera/index.html">Vjera</a>
        <a href="pages/branitelji/index.html">Branitelji</a>
        <a href="pages/kviz/index.html" class="ps-nav-cta">Kviz</a>
      </nav>
    </div>
  </header>

  <main class="search-page">
    <div class="container">
      <section class="search-hero" aria-labelledby="search-title">
        <div class="search-kicker">PatriaSoul pretraga</div>
        <h1 id="search-title">Što želiš pronaći?</h1>
        <p>Pretraži sadržaj PatriaSoula — povijest, baštinu, gradove, vjeru, branitelje, vijesti i kvizove.</p>
        <form class="search-box" id="search-form" role="search">
          <label class="sr-only" for="site-search-input">Upiši pojam za pretraživanje</label>
          <input id="site-search-input" name="q" type="search" autocomplete="off" placeholder="npr. Dubrovnik, Zrinski, glagoljica..." minlength="2">
          <button type="submit">🔎 Pretraži</button>
        </form>
      </section>

      <div id="search-status" class="search-status" aria-live="polite"></div>
      <section id="search-results" class="search-results" aria-live="polite" aria-label="Rezultati pretraživanja"></section>
    </div>
  </main>

  <script>
    (() => {
      const form = document.getElementById('search-form');
      const input = document.getElementById('site-search-input');
      const status = document.getElementById('search-status');
      const results = document.getElementById('search-results');
      const menu = document.querySelector('.ps-menu');
      const nav = document.getElementById('main-navigation');
      let pages = [];
      let indexReady = false;

      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const normalize = value => String(value || '').toLocaleLowerCase('hr-HR').normalize('NFD').replace(/[\u0300-\u036f]/g, '');

      function showLoading(message='Učitavam sadržaj za pretraživanje…') {
        status.textContent = message;
        results.innerHTML = '<div class="search-loading"><span class="search-spinner" aria-hidden="true"></span><span>Molimo trenutak…</span></div>';
      }

      function extractText(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        doc.querySelectorAll('script,style,noscript,template,svg').forEach(el => el.remove());
        return (doc.body?.textContent || '').replace(/\s+/g, ' ').trim();
      }

      function titleFrom(html, url) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const title = doc.querySelector('title')?.textContent?.trim();
        if (title) return title.replace(/\s*[|–-]\s*PatriaSoul.*$/i, '').trim();
        const heading = doc.querySelector('h1')?.textContent?.trim();
        if (heading) return heading;
        return decodeURIComponent(url.split('/').pop() || 'PatriaSoul').replace(/\.html$/i,'').replace(/[-_]/g,' ');
      }

      async function loadIndex() {
        if (indexReady) return;
        showLoading();
        try {
          const response = await fetch('sitemap.xml', {cache:'no-store'});
          if (!response.ok) throw new Error('Sitemap nije dostupan');
          const xml = await response.text();
          const doc = new DOMParser().parseFromString(xml, 'application/xml');
          const urls = [...doc.querySelectorAll('loc')].map(el => el.textContent.trim());
          const currentOrigin = location.origin;
          const allowed = urls.filter(url => {
            try {
              const u = new URL(url);
              return u.origin === currentOrigin && !u.pathname.includes('/admin/') && !u.pathname.includes('/components/');
            } catch { return false; }
          });

          const batchSize = 8;
          const collected = [];
          for (let i=0; i<allowed.length; i+=batchSize) {
            const batch = allowed.slice(i, i+batchSize);
            const loaded = await Promise.all(batch.map(async url => {
              try {
                const response = await fetch(url, {cache:'no-store'});
                if (!response.ok) return null;
                const html = await response.text();
                const path = new URL(url).pathname;
                return {url, path, title:titleFrom(html,url), text:extractText(html)};
              } catch { return null; }
            }));
            collected.push(...loaded.filter(Boolean));
            status.textContent = `Pripremam pretragu… ${Math.min(i + batch.length, allowed.length)}/${allowed.length}`;
          }
          pages = collected;
          indexReady = true;
        } catch (error) {
          indexReady = false;
          status.textContent = 'Pretraga trenutno nije mogla učitati sadržaj.';
          results.innerHTML = '<div class="search-empty">Provjeri vezu i pokušaj ponovno.</div>';
          throw error;
        }
      }

      function snippet(text, query) {
        const source = text.replace(/\s+/g,' ').trim();
        const normalizedSource = normalize(source);
        const normalizedQuery = normalize(query);
        const pos = normalizedSource.indexOf(normalizedQuery);
        if (pos < 0) return source.slice(0, 220) + (source.length > 220 ? '…' : '');
        const start = Math.max(0, pos - 90);
        const end = Math.min(source.length, pos + query.length + 130);
        return (start ? '…' : '') + source.slice(start,end) + (end < source.length ? '…' : '');
      }

      async function search(query) {
        query = query.trim();
        if (query.length < 2) {
          status.textContent = '';
          results.innerHTML = '<div class="search-empty">Upiši barem dva znaka za pretraživanje.</div>';
          return;
        }
        await loadIndex();
        const terms = normalize(query).split(/\s+/).filter(Boolean);
        const matches = pages.map(page => {
          const haystack = normalize(page.title + ' ' + page.text);
          const hits = terms.filter(term => haystack.includes(term)).length;
          return {...page, score:hits, exact:haystack.includes(normalize(query))};
        }).filter(page => page.score > 0).sort((a,b) => (b.exact-a.exact) || (b.score-a.score) || a.title.localeCompare(b.title,'hr'));

        status.textContent = matches.length ? `Pronađeno rezultata: ${matches.length}` : `Nema rezultata za „${query}”.`;
        if (!matches.length) {
          results.innerHTML = '<div class="search-empty">Pokušaj s drugim pojmom, npr. <strong>Hrvatska</strong>, <strong>Dubrovnik</strong>, <strong>baština</strong> ili <strong>Domovinski rat</strong>.</div>';
          return;
        }
        results.innerHTML = matches.slice(0,50).map(page => `
          <a class="search-result" href="${escapeHtml(page.path)}">
            <h2>${escapeHtml(page.title)}</h2>
            <div class="url">${escapeHtml(page.path)}</div>
            <p>${escapeHtml(snippet(page.text, query))}</p>
          </a>
        `).join('');
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const query = input.value.trim();
        const url = new URL(location.href);
        if (query) url.searchParams.set('q', query); else url.searchParams.delete('q');
        history.replaceState(null,'',url);
        search(query).catch(() => {});
      });

      menu?.addEventListener('click', () => {
        const open = nav.classList.toggle('is-open');
        menu.setAttribute('aria-expanded', String(open));
      });

      const initialQuery = new URLSearchParams(location.search).get('q') || '';
      input.value = initialQuery;
      if (initialQuery) search(initialQuery).catch(() => {});
      else results.innerHTML = '<div class="search-empty">Pretraga obuhvaća javne stranice navedene u sitemapu PatriaSoula.</div>';
    })();
  </script>
</body>
</html>
