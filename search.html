<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Centralna PatriaSoul pretraga povijesti, baštine, gradova, vjere, branitelja, medija i kvizova."><meta name="theme-color" content="#07090d"><link rel="manifest" href="/manifest.json"><title>Pretraži | PatriaSoul</title><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/responsive.css"><script src="/site-navigation.js?v=43" defer></script><style>.search-page{padding:48px 0 80px}.search-hero{max-width:900px;margin:0 auto 28px;text-align:center}.search-kicker{color:var(--ps-gold-2);font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.search-hero h1{margin:8px 0 10px;font-size:clamp(34px,5vw,58px)}.search-hero p{color:var(--ps-muted)}.search-box{display:flex;gap:10px;max-width:820px;margin:25px auto}.search-box input{flex:1;min-width:0;padding:15px 17px;border:1px solid var(--ps-line);border-radius:14px;background:var(--ps-surface);color:var(--ps-text);font:inherit}.search-box button,.filter{border:0;border-radius:12px;background:var(--ps-gold);color:#111;font-weight:900;padding:12px 18px;cursor:pointer}.filters{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px auto 30px}.filter{background:var(--ps-surface-2);color:var(--ps-text);border:1px solid var(--ps-line)}.filter[aria-pressed=true],.filter:hover{background:var(--ps-gold);color:#111}.search-status{max-width:1000px;margin:0 auto 15px;color:var(--ps-muted)}.search-results{display:grid;gap:14px;max-width:1000px;margin:auto}.search-result{display:block;padding:20px 22px;border:1px solid var(--ps-line);border-radius:16px;background:linear-gradient(145deg,var(--ps-surface),rgba(18,24,33,.72));text-decoration:none}.search-result:hover{border-color:rgba(217,184,76,.4);transform:translateY(-2px)}.search-result h2{margin:0 0 6px;color:var(--ps-gold-2);font-size:20px}.search-result .meta{font-size:12px;color:#778392;margin-bottom:8px}.search-result p{margin:0;color:#c5ccd5;line-height:1.65}.search-empty{text-align:center;padding:34px;border:1px dashed var(--ps-line);border-radius:16px;color:var(--ps-muted)}@media(max-width:640px){.search-page{padding-top:30px}.search-box{flex-direction:column}.search-box button{min-height:48px}}</style><link rel="stylesheet" href="/patriasoul-global.css">

</head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html"><span class="ps-brand-mark">PS</span>PATRIA<span>SOUL</span></a><nav class="ps-mainnav"></nav><button class="ps-menu" data-ps-menu type="button" aria-label="Izbornik" aria-expanded="false">☰</button></div></header><main class="search-page"><div class="container"><section class="search-hero"><div class="search-kicker">PatriaSoul pretraga</div><h1>Pronađi što tražiš</h1><p>Pretraži javne stranice i filtriraj rezultate po području.</p><form class="search-box" id="search-form" role="search"><label class="sr-only" for="q">Pojam</label><input id="q" name="q" type="search" placeholder="npr. Dubrovnik, Zrinski, Sinjska alka…" minlength="2"><button type="submit">🔎 Pretraži</button></form><div class="filters" role="group" aria-label="Kategorija"><button class="filter" data-filter="all" aria-pressed="true">Sve</button><button class="filter" data-filter="povijest">Povijest</button><button class="filter" data-filter="bastina">Baština</button><button class="filter" data-filter="gradovi">Gradovi</button><button class="filter" data-filter="vjera">Vjera</button><button class="filter" data-filter="branitelji">Branitelji</button><button class="filter" data-filter="kviz">Kviz</button><button class="filter" data-filter="mediji">Mediji</button></div></section><div id="search-status" class="search-status" aria-live="polite"></div><section id="search-results" class="search-results" aria-live="polite"></section></div></main><script>
(()=>{const form=document.getElementById('search-form'),input=document.getElementById('q'),status=document.getElementById('search-status'),results=document.getElementById('search-results');let pages=[],filter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s||'').toLocaleLowerCase('hr-HR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const category=path=>{const p=path.toLowerCase();if(/povijest/.test(p))return'povijest';if(/bastina/.test(p))return'bastina';if(/grad/.test(p))return'gradovi';if(/vjera|evandelje|molitve|krunica|blagdani|biblija/.test(p))return'vjera';if(/branitelj|brigad|postroj|domovinski|vukovar|heroji|operacije|spomenici/.test(p))return'branitelji';if(/quiz|kviz|rang-lista|brani-svoj-grad/.test(p))return'kviz';if(/video|galerija/.test(p))return'mediji';return'all'};const snippet=(text,q)=>{const n=norm(text),i=n.indexOf(norm(q));if(i<0)return text.slice(0,220)+(text.length>220?'…':'');const a=Math.max(0,i-90),b=Math.min(text.length,i+q.length+130);return(a?'…':'')+text.slice(a,b)+(b<text.length?'…':'')};async function load(){if(pages.length)return;status.textContent='Učitavam indeks…';const r=await fetch('/sitemap.xml',{cache:'no-store'});if(!r.ok)throw Error('sitemap');const d=new DOMParser().parseFromString(await r.text(),'application/xml');const urls=[...d.querySelectorAll('loc')].map(x=>x.textContent.trim()).filter(u=>{try{const x=new URL(u);return x.origin===location.origin&&!/\/admin\/|\/components\//.test(x.pathname)}catch{return false}});for(let i=0;i<urls.length;i+=8){const batch=await Promise.all(urls.slice(i,i+8).map(async url=>{try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)return null;const h=await r.text(),d=new DOMParser().parseFromString(h,'text/html'),t=d.querySelector('title')?.textContent?.trim()||d.querySelector('h1')?.textContent?.trim()||url;d.querySelectorAll('script,style,noscript,svg').forEach(x=>x.remove());return{url,path:new URL(url).pathname,title:t.replace(/\s*[|–-]\s*PatriaSoul.*$/i,''),text:(d.body?.textContent||'').replace(/\s+/g,' ').trim(),category:category(new URL(url).pathname)}}catch{return null}}));pages.push(...batch.filter(Boolean));status.textContent=`Pripremam pretragu… ${Math.min(i+8,urls.length)}/${urls.length}`} }function render(q){const terms=norm(q).split(/\s+/).filter(Boolean);let rows=pages.map(p=>{const h=norm(p.title+' '+p.text),score=terms.filter(t=>h.includes(t)).length;return{...p,score,exact:h.includes(norm(q))}}).filter(x=>x.score&& (filter==='all'||x.category===filter)).sort((a,b)=>(b.exact-a.exact)||(b.score-a.score)||a.title.localeCompare(b.title,'hr'));status.textContent=rows.length?`Pronađeno: ${rows.length}`:`Nema rezultata za „${q}”.`;results.innerHTML=rows.slice(0,50).map(p=>`<a class="search-result" href="${esc(p.path)}"><h2>${esc(p.title)}</h2><div class="meta">${esc(p.category)} · ${esc(p.path)}</div><p>${esc(snippet(p.text,q))}</p></a>`).join('')||'<div class="search-empty">Pokušaj drugim pojmom ili odaberi kategoriju „Sve”.</div>'}async function run(q){q=q.trim();if(q.length<2){status.textContent='Upiši barem dva znaka.';results.innerHTML='<div class="search-empty">Pretraži npr. „Hrvatska”, „Sinj”, „Vukovar” ili „glagoljica”.</div>';return}await load();render(q)}form.addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim(),u=new URL(location.href);q?u.searchParams.set('q',q):u.searchParams.delete('q');history.replaceState(null,'',u);run(q).catch(()=>{status.textContent='Pretraga trenutno nije dostupna.'})});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(input.value)run(input.value)}));const initial=new URLSearchParams(location.search).get('q')||'';input.value=initial;initial?run(initial).catch(()=>{}):results.innerHTML='<div class="search-empty">Indeks pretražuje javne stranice navedene u sitemapu.</div>'})();
</script></body></html>
