<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PatriaSoul kviz hrvatske povijesti, geografije, baštine i znanja."><meta name="theme-color" content="#c9a227"><link rel="manifest" href="/manifest.json"><title>Kviz | PatriaSoul</title><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/quiz.css"><link rel="stylesheet" href="/responsive.css"><link rel="stylesheet" href="/patriasoul-global.css"><script src="/site-navigation.js?v=42" defer></script>
</head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html">PATRIA<span>SOUL</span></a><nav class="ps-mainnav"></nav><button class="ps-menu" data-ps-menu type="button" aria-label="Otvori izbornik" aria-expanded="false">☰</button></div></header><main class="quiz-page"><section class="ps-page-hero"><div class="container"><span class="ps-kicker">🧠 ZNANJE</span><h1>PatriaSoul Kviz</h1><p>15 sekundi po pitanju · nasumični odgovori · bodovi · XP · značke.</p></div></section><section class="ps-section"><div class="container qwrap"><div class="quiz-card"><section id="start"><div class="quiz-heading"><h2>Odaberi izazov</h2><p id="bankInfo">Učitavanje baze pitanja…</p></div><div class="modes" role="group" aria-label="Vrsta kviza"><button class="mode active" data-mode="mixed" type="button">🇭🇷 Miješani<br><small>Sve teme</small></button><button class="mode" data-mode="daily" type="button">📅 Dnevni<br><small>Isti izazov danas</small></button><button class="mode" data-mode="weekly" type="button">🗓️ Tjedni<br><small>Tjedni izazov</small></button><button class="mode" data-mode="monthly" type="button">📆 Mjesečni<br><small>Mjesečni izazov</small></button></div><div class="quiz-form"><input id="nick" maxlength="20" autocomplete="nickname" placeholder="Tvoj nadimak" aria-label="Tvoj nadimak"><button class="ps-btn" id="startBtn" type="button">Započni kviz →</button></div><p id="err" class="quiz-error" role="alert"></p></section><section id="game" class="quiz-game"><div class="quiz-top"><span id="progress"></span><span class="quiz-timer" id="timerBox">⏱️ <b id="time">15</b> s</span></div><div class="quiz-progressbar"><i id="bar"></i></div><h2 id="question" class="quiz-question"></h2><div id="answers" class="answers"></div><p id="feedback" class="quiz-feedback" aria-live="polite"></p></section><section id="result" class="quiz-result"><span class="ps-kicker">🏆 IZAZOV ZAVRŠEN</span><h2>Odličan rezultat!</h2><div id="score" class="quiz-score">0</div><div>bodova</div><div class="quiz-stats"><div class="quiz-stat"><strong id="correctStat">0/10</strong><span>točnih</span></div><div class="quiz-stat"><strong id="xpStat">0</strong><span>novi XP</span></div><div class="quiz-stat"><strong id="modeStat">Miješani</strong><span>način igre</span></div></div><p id="resultText" class="quiz-result-text"></p><div class="quiz-actions"><button class="ps-btn" id="again" type="button">Igraj ponovno</button><a class="ps-btn ps-btn-ghost" href="/rang-lista.html">Rang-lista</a><a class="ps-btn ps-btn-ghost" href="/profil.html">Moj profil</a></div></section></div></div></section></main><script src="/patriasoul-profile.js"></script><script src="/levels.js"></script><script src="/badges.js"></script><script src="/quiz.js"></script><script src="/leaderboard.js"></script><script>(function(){'use strict';document.addEventListener('DOMContentLoaded',function(){const $=id=>document.getElementById(id);let mode='mixed',qs=[],pos=0,points=0,correct=0,timer,left=15,locked=false;const labels={mixed:'Miješani',daily:'Dnevni',weekly:'Tjedni',monthly:'Mjesečni'};document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',function(){document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode}));PatriaQuiz.ready.then(function(){const v=PatriaQuiz.validate();$('bankInfo').textContent=`${v.total.toLocaleString('hr-HR')} pitanja · ${v.invalid?'⚠️ '+v.invalid+' neispravnih':'✓ baza spremna'}`}).catch(function(){$('bankInfo').textContent='Baza pitanja nije dostupna.'});function start(){const n=$('nick').value.trim();const r=PatriaPlayer.choose(n);if(!r||!r.name){$('err').textContent='Upiši nadimak za početak.';return}$('err').textContent='';qs=mode==='mixed'?PatriaQuiz.byCategory('mijesani',10):PatriaQuiz.periodQuiz(mode,10);if(!qs.length){$('err').textContent='Trenutačno nema pitanja za ovaj izazov.';return}pos=0;points=0;correct=0;$('start').classList.add('quiz-hidden');$('result').classList.remove('is-active');$('game').classList.add('is-active');show()}function show(){locked=false;const q=qs[pos];$('progress').textContent=`Pitanje ${pos+1}/${qs.length}`;$('question').textContent=q.question;$('feedback').textContent='';$('answers').innerHTML='';q.options.forEach(function(o,i){const b=document.createElement('button');b.className='answer';b.type='button';b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span>'+escapeHtml(o.text);b.addEventListener('click',function(){answer(i)});$('answers').appendChild(b)});clearInterval(timer);left=15;$('time').textContent=left;$('timerBox').classList.remove('danger');$('bar').style.width='100%';timer=setInterval(function(){left--;$('time').textContent=left;$('bar').style.width=(left/15*100)+'%';if(left<=5)$('timerBox').classList.add('danger');if(left<=0){clearInterval(timer);answer(-1)}},1000)}function escapeHtml(s){return String(s).replace(/[&<>\"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])})}function answer(i){if(locked)return;locked=true;clearInterval(timer);const q=qs[pos],bs=[...$('answers').children],ok=i===q.correctIndex;bs.forEach(b=>b.disabled=true);if(i>=0)bs[i].classList.add(ok?'correct':'wrong');if(ok){const gained=100+left*5;points+=gained;correct++;$('feedback').textContent=`Točno! +${gained} bodova`;}else{if(q.options[q.correctIndex])bs[q.correctIndex].classList.add('correct');$('feedback').textContent='Točan odgovor: '+q.options[q.correctIndex].text}setTimeout(function(){pos++;pos<qs.length?show():finish()},650)}async function finish(){const p=PatriaPlayer.recordResult({category:'mijesano',period:mode,points,xp:points,correct,answers:qs.length});PatriaBadges.evaluate(p);try{await PatriaLeaderboard.submit({points,xp:points,correct,answers:qs.length,period:mode})}catch(_){}$('game').classList.remove('is-active');$('result').classList.add('is-active');$('score').textContent=points;$('correctStat').textContent=correct+'/'+qs.length;$('xpStat').textContent=points;$('modeStat').textContent=labels[mode];$('resultText').textContent=`${p.name||'Igrač'} · rezultat je spremljen u profil.`}function again(){$('result').classList.remove('is-active');$('start').classList.remove('quiz-hidden');$('err').textContent='';$('nick').value=PatriaPlayer.current().name||'';$('nick').focus()}$('startBtn').addEventListener('click',start);$('nick').addEventListener('keydown',e=>{if(e.key==='Enter')start()});$('again').addEventListener('click',again);$('nick').value=PatriaPlayer.current().name||'';});})();</script></body></html>
