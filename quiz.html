<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PatriaSoul kviz hrvatske povijesti, geografije, baštine i znanja."><meta name="theme-color" content="#c9a227"><link rel="manifest" href="/manifest.json"><title>Kviz | PatriaSoul</title><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/quiz.css"><link rel="stylesheet" href="/responsive.css"><link rel="stylesheet" href="/patriasoul-global.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><script src="/site-navigation.js" defer></script></head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html"><span class="ps-brand-mark">PS</span>PATRIA<span>SOUL</span></a><nav class="ps-mainnav"></nav><button class="ps-menu" data-ps-menu aria-label="Izbornik" aria-expanded="false">☰</button></div></header><main class="quiz-page"><section class="ps-page-hero"><div class="container"><span class="ps-kicker">🧠 ZNANJE</span><h1>Hrvatski kviz</h1><p>15 sekundi po pitanju · preslagivanje odgovora · XP · značke.</p></div></section><section class="ps-section"><div class="container qwrap"><div class="quiz-card"><section id="start"><div class="quiz-heading"><div><h2>Odaberi izazov</h2><p id="bankInfo">Učitavanje baze…</p></div></div><div class="modes" role="group"><button class="mode active" data-mode="mixed">🇭🇷 Miješani</button><button class="mode" data-mode="daily">📅 Dnevni</button><button class="mode" data-mode="weekly">🗓️ Tjedni</button><button class="mode" data-mode="monthly">📆 Mjesečni</button></div><div class="quiz-form"><input id="nick" maxlength="20" autocomplete="nickname" placeholder="Tvoj nadimak"><button class="ps-btn" id="startBtn">Igraj →</button></div><p id="err" class="quiz-error" role="alert"></p></section><section id="game" class="quiz-game"><div class="quiz-top"><span id="progress"></span><span>⏱️ <b id="time">15</b> s</span></div><div class="quiz-progressbar"><i id="bar"></i></div><h2 id="question" class="quiz-question"></h2><div id="answers" class="answers"></div><p id="feedback" class="quiz-feedback" aria-live="polite"></p></section><section id="result" class="quiz-result"><span class="ps-kicker">🏆 ZAVRŠENO</span><h2>Rezultat</h2><div id="score" class="quiz-score">0</div><div>bodova</div><p id="resultText"></p><button class="ps-btn" id="again">Igraj ponovno</button> <a class="ps-btn ps-btn-ghost" href="/profil.html">Moj profil</a></section></div></div></section></main><script src="/patriasoul-profile.js"></script><script src="/levels.js"></script><script src="/badges.js"></script><script src="/quiz.js"></script><script src="/leaderboard.js"></script><script>(function(){document.addEventListener('DOMContentLoaded',()=>{const $=id=>document.getElementById(id);let mode='mixed',qs=[],pos=0,points=0,correct=0,timer,left=15;document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});PatriaQuiz.ready.then(()=>{const v=PatriaQuiz.validate();$('bankInfo').textContent=`${v.total.toLocaleString('hr-HR')} pitanja · ${v.invalid?'⚠️ '+v.invalid+' neispravnih':'baza validna'}`});function start(){const n=$('nick').value.trim();const r=PatriaPlayer.choose(n);if(!r||!r.name){$('err').textContent='Upiši nadimak za početak.';return}qs=mode==='mixed'?PatriaQuiz.byCategory('mijesani',10):PatriaQuiz.periodQuiz(mode,10);if(!qs.length){$('err').textContent='Nema pitanja.';return}pos=points=correct=0;$('start').classList.add('quiz-hidden');$('result').classList.remove('is-active');$('game').classList.add('is-active');show()}function show(){const q=qs[pos];$('progress').textContent=`Pitanje ${pos+1}/${qs.length}`;$('question').textContent=q.question;$('feedback').textContent='';$('answers').innerHTML='';q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.type='button';b.textContent=`${String.fromCharCode(65+i)}) ${o.text}`;b.onclick=()=>answer(i);$('answers').appendChild(b)});clearInterval(timer);left=15;$('time').textContent=left;$('bar').style.width='100%';timer=setInterval(()=>{left--;$('time').textContent=left;$('bar').style.width=(left/15*100)+'%';if(left<=0){clearInterval(timer);answer(-1)}},1000)}function answer(i){clearInterval(timer);const q=qs[pos],bs=[...$('answers').children],ok=i===q.correctIndex;bs.forEach(b=>b.disabled=true);if(i>=0)bs[i].classList.add(ok?'correct':'wrong');if(ok){const gained=100+left*5;points+=gained;correct++;$('feedback').textContent=`Točno! +${gained}`}else{bs[q.correctIndex]?.classList.add('correct');$('feedback').textContent=`Točan odgovor: ${q.options[q.correctIndex].text}`}setTimeout(()=>{pos++;pos<qs.length?show():finish()},650)}async function finish(){const p=PatriaPlayer.recordResult({category:'mijesano',period:mode,points,xp:points,correct,answers:qs.length});PatriaBadges.evaluate(p);try{await PatriaLeaderboard.submit({points,xp:points,correct,answers:qs.length,period:mode})}catch(_){}$('game').classList.remove('is-active');$('result').classList.add('is-active');$('score').textContent=points;$('resultText').textContent=`${correct}/${qs.length} točnih · ${p.name||'Igrač'} · ${p.xp} ukupno XP`}$('startBtn').onclick=start;$('nick').value=PatriaPlayer.current().name||'';$('again').onclick=()=>{$('result').classList.remove('is-active');$('start').classList.remove('quiz-hidden')};})})();</script></body></html>
