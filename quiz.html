<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PatriaSoul Hrvatski kviz — provjeri znanje iz hrvatske povijesti, geografije, vjere, baštine, gradova i Domovinskog rata."><title>Hrvatski kviz | PatriaSoul</title><link rel="stylesheet" href="patriasoul-modern.css"><link rel="stylesheet" href="quiz.css"></head>
<body><div id="site-header"></div><main>
<section class="ps-page-hero"><div class="container"><div class="ps-breadcrumbs"><a href="/index.html">Početna</a> / Kviz</div><span class="ps-kicker">🧠 Znanje</span><h1>Hrvatski kviz</h1><p>Deset pitanja, četiri odgovora i novi izazov svaki put. Odaberi kategoriju ili igraj miješani kviz.</p></div></section>
<section class="ps-section"><div class="container"><div class="ps-grid ps-grid-3"><button class="ps-card" data-quiz="povijest"><div class="ps-card-icon">📜</div><h3>Hrvatska povijest</h3><p>Vladari, događaji i ključni trenuci.</p></button><button class="ps-card" data-quiz="domovinski_rat"><div class="ps-card-icon">🛡️</div><h3>Domovinski rat</h3><p>Obrana Hrvatske i važni događaji.</p></button><button class="ps-card" data-quiz="geografija"><div class="ps-card-icon">🗺️</div><h3>Geografija</h3><p>Gradovi, rijeke, otoci i regije.</p></button><button class="ps-card" data-quiz="katolicka_bastina"><div class="ps-card-icon">✝️</div><h3>Katolička baština</h3><p>Vjera, sveci i hrvatska duhovna baština.</p></button><button class="ps-card" data-quiz="gradovi"><div class="ps-card-icon">🏙️</div><h3>Gradovi i znamenitosti</h3><p>Hrvatski gradovi i njihove posebnosti.</p></button><button class="ps-card" data-quiz="mijesani"><div class="ps-card-icon">🇭🇷</div><h3>Miješani kviz</h3><p>Sve kategorije zajedno.</p></button></div>
<div id="quiz-app" class="ps-feature" style="margin-top:24px"><div class="ps-feature-body"><span class="ps-kicker">Spremno za igru</span><h2 id="quiz-title">Odaberi kategoriju</h2><div id="quiz-status"><p>Odaberi jednu kategoriju iznad. Kviz engine automatski preslaguje odgovore.</p></div><div id="quiz-actions" class="ps-actions" style="margin-top:20px"></div></div></div></div></section>
</main><div id="site-footer"></div>
<script src="data.js"></script><script src="quiz.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{const cards=document.querySelectorAll('[data-quiz]');const title=document.getElementById('quiz-title');const status=document.getElementById('quiz-status');const actions=document.getElementById('quiz-actions');cards.forEach(card=>card.addEventListener('click',()=>{const category=card.dataset.quiz;const qs=PatriaQuiz.byCategory(category,10);title.textContent=card.querySelector('h3').textContent;status.innerHTML=`<p>Pripremljeno je <strong>${qs.length}</strong> pitanja.</p><div id="quiz-question"></div>`;actions.innerHTML='<button class="ps-btn ps-btn-primary" id="start-quiz">Pokreni →</button>';document.getElementById('start-quiz').onclick=()=>start(qs,title,status,actions)}));function start(qs,title,status,actions){let i=0,correct=0;const render=()=>{const q=qs[i];status.innerHTML=`<p><strong>Pitanje ${i+1} / ${qs.length}</strong></p><h3 style="margin-top:12px">${q.question}</h3><div id="answers" style="display:grid;gap:10px;margin-top:18px"></div><p id="fb" style="margin-top:14px"></p>`;const box=document.getElementById('answers');q.options.forEach((o,n)=>{const b=document.createElement('button');b.className='ps-btn ps-btn-ghost';b.style.textAlign='left';b.textContent=`${String.fromCharCode(65+n)}. ${o.text}`;b.onclick=()=>{if(box.dataset.done)return;box.dataset.done='1';[...box.children].forEach(x=>x.disabled=true);if(n===q.correctIndex){correct++;b.textContent+=' ✓';document.getElementById('fb').textContent='Točan odgovor.'}else{b.textContent+=' ✕';const cb=[...box.children][q.correctIndex];if(cb)cb.textContent+=' ✓';document.getElementById('fb').textContent='Netočno.'}const next=document.createElement('button');next.className='ps-btn ps-btn-primary';next.textContent=i===qs.length-1?'Rezultat':'Sljedeće pitanje →';next.style.marginTop='14px';next.onclick=()=>{i++;if(i<qs.length)render();else finish()};status.appendChild(next)};box.appendChild(b)});render();function finish(){title.textContent='Rezultat kviza';status.innerHTML=`<h3>${correct} / ${qs.length} točnih odgovora</h3><p style="margin-top:10px">Dobro odrađeno. Svaki novi pokušaj daje ti novu priliku za znanje.</p>`;actions.innerHTML='<button class="ps-btn ps-btn-primary" id="retry">Igraj ponovno</button>';document.getElementById('retry').onclick=()=>start(PatriaQuiz.byCategory(title.textContent==='Miješani kviz'?'mijesani':'povijest',10),title,status,actions)}}});
</script>
<script src="app.js" defer></script></body></html>
