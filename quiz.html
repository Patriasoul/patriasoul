<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="PatriaSoul Hrvatski kviz — 10 kategorija i 1000 pitanja o Hrvatskoj.">
<title>Hrvatski kviz | PatriaSoul</title>
<link rel="stylesheet" href="patriasoul-modern.css"><link rel="stylesheet" href="quiz.css">
<style>
.quiz-modes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.quiz-modes button.active{border-color:var(--ps-gold);box-shadow:0 0 0 1px var(--ps-gold)}
.quiz-meta{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 20px}.quiz-pill{padding:7px 11px;border:1px solid rgba(212,174,56,.25);border-radius:999px;background:rgba(212,174,56,.05);font-size:13px;font-weight:800}
#category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.quiz-category{text-align:left;cursor:pointer}.quiz-category.selected{border-color:var(--ps-gold);box-shadow:0 0 0 1px var(--ps-gold)}
.quiz-answer{width:100%;text-align:left;margin-top:10px}.quiz-answer.correct{border-color:#36a269!important}.quiz-answer.wrong{border-color:#d85b64!important}.quiz-timer{font-weight:900;color:var(--ps-gold-2)}
@media(max-width:800px){#category-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){#category-grid{grid-template-columns:1fr}}
</style>
</head>
<body><div id="site-header"></div><main>
<section class="ps-page-hero"><div class="container"><div class="ps-breadcrumbs"><a href="/index.html">Početna</a> / Kviz</div><span class="ps-kicker">🧠 Znanje</span><h1>Hrvatski kviz</h1><p>10 kategorija · 1000 pitanja · izmiješani odgovori. Pokaži koliko poznaješ Hrvatsku.</p></div></section>
<section class="ps-section"><div class="container">
<div class="quiz-meta"><span class="quiz-pill">🇭🇷 1000 pitanja</span><span class="quiz-pill">📚 10 kategorija</span><span class="quiz-pill" id="validation-pill">Provjera baze…</span></div>
<div class="quiz-modes"><button class="ps-btn ps-btn-ghost" data-period="daily">📅 Dnevni</button><button class="ps-btn ps-btn-ghost" data-period="weekly">🗓️ Tjedni</button><button class="ps-btn ps-btn-ghost" data-period="monthly">📆 Mjesečni</button><button class="ps-btn ps-btn-ghost active" data-period="random">🎲 Nasumični</button><button class="ps-btn ps-btn-ghost" id="mixed-mode">🇭🇷 Miješani kviz</button></div>
<div id="category-grid"></div>
<div id="quiz-app" class="ps-feature" style="margin-top:24px"><div class="ps-feature-body"><span class="ps-kicker">Spremno za igru</span><h2 id="quiz-title">Odaberi kategoriju</h2><div id="quiz-status"><p>Odaberi kategoriju. Svaki kviz ima 10 pitanja, a odgovori se automatski preslaguju.</p></div><div id="quiz-actions" class="ps-actions" style="margin-top:20px"></div></div></div>
</div></section></main><div id="site-footer"></div>
<script src="quiz.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const grid=document.getElementById('category-grid'),title=document.getElementById('quiz-title'),status=document.getElementById('quiz-status'),actions=document.getElementById('quiz-actions'),pill=document.getElementById('validation-pill'),mixedButton=document.getElementById('mixed-mode');
  const icons={povijest:'📜',domovinski_rat:'🛡️',kraljevi:'👑',katolicka_bastina:'✝️',kulturna_bastina:'🏛️',geografija:'🗺️',glazba:'🎵',gradovi:'🏙️',jezik:'📖',sport:'⚽'};
  const descriptions={povijest:'Ključni događaji hrvatske povijesti.',domovinski_rat:'Obrana Hrvatske i Domovinski rat.',kraljevi:'Hrvatski vladari, dinastije i kraljevi.',katolicka_bastina:'Vjera, sveci, svetišta i duhovna baština.',kulturna_bastina:'Baština, spomenici, tradicija i umjetnost.',geografija:'Planine, rijeke, otoci, regije i priroda.',glazba:'Tradicionalna i autorska hrvatska glazba.',gradovi:'Hrvatski gradovi, znamenitosti i povijest.',jezik:'Hrvatski jezik, književnost i pisci.',sport:'Hrvatski sportaši, klubovi i velika natjecanja.'};
  const labels=PatriaQuiz.categories();const v=PATRIA_QUIZ_VALIDATION;pill.textContent=v.exact1000?'✅ Baza potvrđena: 10 × 100':'⚠️ Baza nije potpuna';
  labels.forEach(category=>{const b=document.createElement('button');b.className='ps-card quiz-category';b.dataset.quiz=category;b.innerHTML=`<div class="ps-card-icon">${icons[category]||'🇭🇷'}</div><h3>${PATRIA_CATEGORIES[category]}</h3><p>${descriptions[category]||'PatriaSoul kategorija.'}</p><span class="ps-card-link">100 pitanja →</span>`;b.onclick=()=>selectCategory(category,b);grid.appendChild(b)});
  let selected=labels[0],mode='random',mixed=false;
  function makeQuestions(){if(mixed)return mode==='random'?PatriaQuiz.byCategory('mijesani',10):PatriaQuiz.periodCategoryQuiz(mode,'mijesani',10);return mode==='random'?PatriaQuiz.byCategory(selected,10):PatriaQuiz.periodCategoryQuiz(mode,selected,10)}
  function selectCategory(category,button){mixed=false;mixedButton.classList.remove('active');selected=category;document.querySelectorAll('.quiz-category').forEach(x=>x.classList.remove('selected'));button.classList.add('selected');prepare();}
  mixedButton.onclick=()=>{mixed=true;mixedButton.classList.add('active');document.querySelectorAll('.quiz-category').forEach(x=>x.classList.remove('selected'));prepare()};
  document.querySelectorAll('[data-period]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.classList.remove('active'));button.classList.add('active');prepare()}));
  function currentTitle(){return mixed?'🇭🇷 Miješani kviz':PATRIA_CATEGORIES[selected]}
  function prepare(){const qs=makeQuestions();title.textContent=currentTitle();status.innerHTML=`<p>Pripremljeno je <strong>${qs.length}</strong> pitanja za <strong>${currentTitle()}</strong>.</p><p>Način: <strong>${mode==='random'?'nasumični':mode==='daily'?'dnevni':mode==='weekly'?'tjedni':'mjesečni'}</strong>. Točan odgovor nije vezan uz A/B/C/D.</p>`;actions.innerHTML='<button class="ps-btn ps-btn-primary" id="start-quiz">▶ Pokreni kviz</button>';document.getElementById('start-quiz').onclick=()=>start(qs)}
  function start(qs){let i=0,correct=0,points=0;title.textContent=currentTitle();actions.innerHTML='';render();
    function render(){const q=qs[i];status.innerHTML=`<div style="display:flex;justify-content:space-between;gap:15px"><strong>Pitanje ${i+1} / ${qs.length}</strong><span class="quiz-timer">100 bodova</span></div><h3 style="margin-top:18px">${q.question}</h3><div id="answers" style="display:grid;gap:10px;margin-top:18px"></div><p id="fb" style="margin-top:14px;min-height:24px"></p>`;const box=document.getElementById('answers');q.options.forEach((o,n)=>{const b=document.createElement('button');b.className='ps-btn ps-btn-ghost quiz-answer';b.textContent=`${String.fromCharCode(65+n)}. ${o.text}`;b.onclick=()=>answer(n,b);box.appendChild(b)});}
    function answer(n,button){const box=document.getElementById('answers');if(box.dataset.done)return;box.dataset.done='1';[...box.children].forEach(x=>x.disabled=true);const q=qs[i];if(n===q.correctIndex){correct++;points+=100;button.classList.add('correct');document.getElementById('fb').textContent='✅ Točan odgovor! +100 bodova.'}else{button.classList.add('wrong');const cb=[...box.children][q.correctIndex];if(cb)cb.classList.add('correct');document.getElementById('fb').textContent=`❌ Netočno. Točan odgovor je ${String.fromCharCode(65+q.correctIndex)}.`}const next=document.createElement('button');next.className='ps-btn ps-btn-primary';next.textContent=i===qs.length-1?'🏆 Rezultat':'Sljedeće pitanje →';next.style.marginTop='14px';next.onclick=()=>{i++;if(i<qs.length)render();else finish()};status.appendChild(next)}
    function finish(){title.textContent='🏆 Rezultat kviza';status.innerHTML=`<h2>${correct} / ${qs.length}</h2><p style="margin-top:10px">Osvojeni bodovi: <strong>${points}</strong></p><p>Uspješnost: <strong>${Math.round(correct/qs.length*100)}%</strong></p>`;actions.innerHTML='<button class="ps-btn ps-btn-primary" id="retry">🔄 Igraj ponovno</button>';document.getElementById('retry').onclick=()=>prepare()}
  }
  document.querySelector('.quiz-category')?.click();
});
</script>
<script src="app.js" defer></script></body></html>
