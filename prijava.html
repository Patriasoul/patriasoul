<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Prijava i registracija PatriaSoul računa."><meta name="theme-color" content="#c9a227"><link rel="manifest" href="/manifest.json"><title>Prijava | PatriaSoul</title><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/responsive.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><script src="/site-navigation.js?v=43" defer></script><link rel="stylesheet" href="/patriasoul-global.css">

<link rel="stylesheet" href="/navigation-layout.css">
</head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html"><span class="ps-brand-mark">PS</span>PATRIA<span>SOUL</span></a><nav class="ps-mainnav"></nav><button class="ps-menu" data-ps-menu type="button" aria-label="Izbornik">☰</button></div></header><main><section class="ps-page-hero"><div class="container"><span class="ps-kicker">👤 Zajednica</span><h1>Prijava</h1><p>Sačuvaj svoj profil, XP, značke, rezultate i mjesto na rang-listi.</p></div></section><section class="ps-section"><div class="container" style="max-width:560px"><div class="ps-card"><form id="auth-form"><label for="name">Ime / nadimak</label><input id="name" name="name" autocomplete="name" maxlength="40"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Lozinka</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="ps-btn" type="submit" data-action="login">Prijava</button><button class="ps-btn" type="button" data-action="signup">Napravi račun</button></div><p id="auth-status" class="ps-muted" role="status" aria-live="polite"></p></form></div></div></section></main><script>
const form=document.getElementById('auth-form'),status=document.getElementById('auth-status');
async function auth(action){status.textContent='Obrada…';const s=window.PatriaSupabase;if(!s?.ready||!s.client){status.textContent='Supabase još nije konfiguriran. Dodaj javni ANON ključ u konfiguraciju projekta.';return}const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,name=document.getElementById('name').value.trim();let result;if(action==='signup')result=await s.client.auth.signUp({email,password,options:{data:{name:name||'PatriaSoul igrač'}}});else result=await s.client.auth.signInWithPassword({email,password});if(result.error){status.textContent=result.error.message;return}status.textContent=action==='signup'?'Račun je izrađen. Provjeri e-mail ako je potvrda uključena.':'Prijava uspješna.';if(action==='login')setTimeout(()=>location.href='/profil.html',500)}
form.addEventListener('submit',e=>{e.preventDefault();auth('login')});document.querySelector('[data-action="signup"]').addEventListener('click',()=>auth('signup'));
</script></body></html>
