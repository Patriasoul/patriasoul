<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PatriaSoul Duel — multiplayer izazov znanja."><meta name="theme-color" content="#c9a227"><link rel="manifest" href="/manifest.json"><title>Duel | PatriaSoul</title><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/responsive.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><script src="/site-navigation.js" defer></script><link rel="stylesheet" href="/patriasoul-global.css">
<script src="/page-hero.js?v=4f520695cde0" defer></script>
</head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html"><span class="ps-brand-mark">PS</span>PATRIA<span>SOUL</span></a><nav class="ps-mainnav"></nav><button class="ps-menu" data-ps-menu type="button" aria-label="Izbornik">☰</button></div></header><main><section class="ps-page-hero"><div class="container"><span class="ps-kicker">⚔️ Multiplayer</span><h1>Duel</h1><p>Izazovi drugog igrača i prati rezultat u stvarnom vremenu.</p></div></section><section class="ps-section"><div class="container" style="max-width:680px"><div class="ps-card"><button id="create" class="ps-btn">Kreiraj sobu</button><div style="display:flex;gap:8px;margin-top:16px"><input id="code" placeholder="Kod sobe" maxlength="8" style="flex:1;padding:12px;border-radius:10px;background:#11161d;color:#fff;border:1px solid #444"><button id="join" class="ps-btn">Pridruži se</button></div><p id="status" class="ps-muted" role="status" aria-live="polite">Za multiplayer je potrebna prijava.</p><div id="room" hidden><h2>Soba <span id="room-code"></span></h2><p id="players"></p><button id="ready" class="ps-btn">Spreman</button></div></div></div></section></main><script>
const status=document.getElementById('status'),room=document.getElementById('room'),codeEl=document.getElementById('room-code'),playersEl=document.getElementById('players');let channel=null,currentRoom=null;const code=()=>Math.random().toString(36).slice(2,8).toUpperCase();async function user(){return window.PatriaSupabase?.client?(await window.PatriaSupabase.client.auth.getUser()).data.user:null}async function create(){const sb=window.PatriaSupabase?.client,u=await user();if(!sb||!u){status.textContent='Prvo se prijavi na PatriaSoul.';return}const c=code(),r=await sb.from('game_rooms').insert({code:c,host_id:u.id}).select().single();if(r.error){status.textContent=r.error.message;return}currentRoom=r.data;await joinRoom(currentRoom)}async function join(){const sb=window.PatriaSupabase?.client,u=await user(),c=document.getElementById('code').value.trim().toUpperCase();if(!sb||!u){status.textContent='Prvo se prijavi na PatriaSoul.';return}const r=await sb.from('game_rooms').select('*').eq('code',c).eq('status','waiting').single();if(r.error){status.textContent='Soba nije pronađena.';return}currentRoom=r.data;await joinRoom(currentRoom)}async function joinRoom(r){const sb=window.PatriaSupabase.client,u=await user();await sb.from('game_room_players').upsert({room_id:r.id,user_id:u.id});room.hidden=false;codeEl.textContent=r.code;channel=sb.channel('room:'+r.id).on('postgres_changes',{event:'*',schema:'public',table:'game_room_players',filter:'room_id=eq.'+r.id},loadPlayers).subscribe();loadPlayers()}async function loadPlayers(){const sb=window.PatriaSupabase.client,r=await sb.from('game_room_players').select('user_id,ready,score').eq('room_id',currentRoom.id);playersEl.textContent='Igrača u sobi: '+(r.data?.length||0)}document.getElementById('create').onclick=create;document.getElementById('join').onclick=join;document.getElementById('ready').onclick=async()=>{const u=await user();if(u&&currentRoom)await window.PatriaSupabase.client.from('game_room_players').update({ready:true}).eq('room_id',currentRoom.id).eq('user_id',u.id)};
</script></body></html>
