<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postrojbe | PatriaSoul</title><meta name="description" content="Registar hrvatskih vojno-redarstvenih postrojbi.">
<link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/patriasoul-global.css">
<style>.registry{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.registry-card{padding:22px}.registry-card h2{margin:0 0 8px}.registry-meta{color:var(--pt-muted);font-size:13px;margin-bottom:14px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{padding:5px 8px;border:1px solid var(--pt-line);border-radius:999px;font-size:11px;color:var(--pt-gold2)}.toolbar{display:flex;gap:12px;align-items:center;margin:26px 0}.toolbar input{flex:1;padding:13px 15px}.empty{padding:35px;text-align:center;color:var(--pt-muted)}@media(max-width:900px){.registry{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.registry{grid-template-columns:1fr}.toolbar{display:block}.toolbar input{width:100%}}</style>
<script src="/page-hero.js?v=8a8a2b8f7662" defer></script>
</head><body>
<header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html"><span class="ps-brand-mark">🇭🇷</span> PATRIA<span>SOUL</span></a><nav class="ps-mainnav"></nav><button class="ps-menu" data-ps-menu aria-label="Otvori izbornik">☰</button></div></header>
<main><section class="ps-page-hero"><div class="container"><p>BRANITELJI · HRVATSKA VOJSKA · MUP</p><h1>Postrojbe</h1><p>Pregled postrojbi hrvatskih obrambenih snaga, strukturiran iz središnjeg registra PatriaSoula.</p></div></section>
<section class="container" style="padding:38px 0 70px"><div class="toolbar"><input id="search" type="search" placeholder="Pretraži postrojbe, nadimak, vrstu ili oznaku…" aria-label="Pretraži postrojbe"><span id="count" class="registry-meta"></span></div><div id="list" class="registry"></div></section></main>
<footer class="ps-footer"><div class="container"><p>PatriaSoul · Znanje, sjećanje i identitet.</p></div></footer>
<script src="/site-navigation.js"></script><script type="module">
import {postrojbe} from '/postrojbe.js';
const list=document.getElementById('list'),search=document.getElementById('search'),count=document.getElementById('count');
function render(){const q=search.value.trim().toLowerCase();const rows=postrojbe.filter(x=>JSON.stringify(x).toLowerCase().includes(q));count.textContent=rows.length+' postrojbi';list.innerHTML=rows.map(x=>`<article class="registry-card ps-card"><h2>${x.naziv}</h2><div class="registry-meta">${x.nadimak?x.nadimak+' · ':''}${x.vrsta||''}${x.godinaUstrojavanja?' · od '+x.godinaUstrojavanja:''}</div><p>${x.znacaj||''}</p><div class="tags">${(x.oznake||[]).slice(0,5).map(t=>`<span class="tag">${t}</span>`).join('')}</div></article>`).join('')||'<div class="empty">Nema rezultata.</div>';}
search.addEventListener('input',render);render();
</script></body></html>
