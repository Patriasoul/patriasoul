name: Cleanup legacy image fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy image-field markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'\s*<link[^>]+href=["\']/patriasoul-image-fields\.css["\'][^>]*>', '', text, flags=re.I)
              text = re.sub(r'\s*<script[^>]+src=["\']/patriasoul-image-fields\.js["\'][^>]*></script>', '', text, flags=re.I)
              text = re.sub(r'\s*<figure[^>]*class=["\'][^"\']*ps-image-field[^"\']*["\'][^>]*>.*?</figure>\s*', '\n', text, flags=re.I|re.S)
              text = text.replace('/images/patria-image-placeholder.svg', '')
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY
          rm -f patriasoul-image-fields.css patriasoul-image-fields.js images/patria-image-placeholder.svg
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No legacy image-field markup found."
            exit 0
          fi
          git add -A
          git commit -m "chore: remove legacy image field markup"
          git push
