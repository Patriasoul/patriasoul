name: PatriaSoul – Knowledge Base

on:
  workflow_dispatch:
  push:
    paths:
      - 'gradovi.js'
      - 'data.js'
      - '*.html'
      - '*.md'
      - 'news-feed.json'
      - 'ai-engine/knowledge/core-knowledge.json'
      - 'scripts/build-knowledge-index.py'
      - '.github/workflows/build-knowledge.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  build-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Izgradi Knowledge Base indeks
        run: python3 scripts/build-knowledge-index.py

      - name: Provjeri Vukovar i core zapise
        shell: python
        run: |
          import json
          with open('ai-engine/knowledge/core-knowledge.json', encoding='utf-8') as f:
              core=json.load(f)
          with open('ai-engine/knowledge/index.json', encoding='utf-8') as f:
              index=json.load(f)
          core_items=core.get('items', core) if isinstance(core, dict) else core
          index_items=index.get('items', [])
          core_ids={str(x.get('id')) for x in core_items if isinstance(x,dict) and x.get('id')}
          index_ids={str(x.get('id')) for x in index_items if isinstance(x,dict) and x.get('id')}
          missing=sorted(core_ids-index_ids)
          if missing:
              raise SystemExit('Nedostaju core zapisi u indeksu: '+', '.join(missing[:20]))
          if not any(str(x.get('id')) == 'city-vukovar-core' for x in index_items):
              raise SystemExit('Vukovar core zapis nije u Knowledge Base indeksu')
          print('Knowledge QA OK:', len(core_ids), 'core zapisa; Vukovar prisutan.')

      - name: Spremi indeks
        run: |
          git config user.name "patriasoul-knowledge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ai-engine/knowledge/index.json
          git diff --cached --quiet && exit 0
          git commit -m "Automatsko osvježavanje PatriaSoul Knowledge Base"
          git push
