name: PatriaSoul – automatsko osvježavanje vijesti

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preuzmi i obradi RSS vijesti
        shell: python
        run: |
          import json, re, html, urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          with open('news-sources.json', encoding='utf-8') as f:
              cfg=json.load(f)

          old_items=[]
          try:
              with open('news-feed.json', encoding='utf-8') as f:
                  old_items=json.load(f).get('items',[])
          except Exception:
              pass
          old_by_link={x.get('link','').rstrip('/'):x for x in old_items if x.get('link')}

          def clean(value):
              value=html.unescape(str(value or ''))
              value=re.sub(r'<[^>]+>', ' ', value)
              return re.sub(r'\s+', ' ', value).strip()

          def lname(tag):
              return str(tag or '').rsplit('}',1)[-1].lower()

          def child_text(node, names):
              wanted={x.lower() for x in names}
              for child in list(node):
                  if lname(child.tag) in wanted and clean(child.text):
                      return clean(child.text)
              for child in node.iter():
                  if child is node: continue
                  if lname(child.tag) in wanted and clean(child.text):
                      return clean(child.text)
              return ''

          def link_value(node):
              for child in list(node):
                  if lname(child.tag) != 'link': continue
                  href=clean(child.attrib.get('href',''))
                  if href: return href
                  if clean(child.text): return clean(child.text)
              return ''

          def category(title, summary, default):
              s=(title+' '+summary).lower()
              rules=[
                ('branitelji',['branitelj','branitelji','veteran','domovinski rat','nestal','poginul','vukovar','oluja','bljesak','hrvi']),
                ('vjera',['crkva','biskup','svećen','svec','misa','molit','katoli','vatikan','isus','kršć']),
                ('povijest',['obljetnic','povijest','povijes','baštin','memorijal','spomenik','godišnjic']),
                ('gradovi',['zagreb','split','sinj','vukovar','knin','dubrovnik','rijeka','osijek','zadar','šibenik','omiš','gospić','pula','varaždin','samobor']),
                ('kultura',['kultura','film','kazališt','muzej','knjig','glazb','izložb','festival','umjet']),
                ('svijet',['europsk','eu ','ukrajin','nato','slovačk','mađarsk','njemačk','francusk','srb','svijet','međunarod']),
              ]
              for c,words in rules:
                  if any(w in s for w in words): return c
              return default

          def parse_date(value):
              if not value: return datetime.now(timezone.utc).isoformat()
              try:
                  return parsedate_to_datetime(value).astimezone(timezone.utc).isoformat()
              except Exception:
                  return value

          items=[]
          source_success=0
          source_counts={}
          errors=[]

          for src in cfg.get('sources',[]):
              try:
                  req=urllib.request.Request(
                      src['feed'],
                      headers={
                          'User-Agent':'Mozilla/5.0 (compatible; PatriaSoul-NewsBot/2.0)',
                          'Accept':'application/rss+xml, application/atom+xml, application/xml, text/xml, */*'
                      }
                  )
                  raw=urllib.request.urlopen(req,timeout=30).read()
                  root=ET.fromstring(raw)
                  nodes=[n for n in root.iter() if lname(n.tag) in ('item','entry')]
                  found=0

                  for node in nodes:
                      title=child_text(node,['title'])
                      link=link_value(node)
                      summary=child_text(node,['description','summary','content','encoded'])
                      date_value=child_text(node,['pubDate','published','updated','date','modified','created'])
                      date=parse_date(date_value)
                      if not title or not link:
                          continue
                      found += 1
                      items.append({
                          'title':title,
                          'summary':summary[:800],
                          'link':link,
                          'date':date,
                          'source':src['name'],
                          'sourceId':src['id'],
                          'category':category(title,summary,src.get('category','domovina'))
                      })

                  source_counts[src['id']]=found
                  if found:
                      source_success += 1
                  else:
                      errors.append(f'{src["id"]}: feed nema prepoznate stavke')
              except Exception as e:
                  source_counts[src['id']]=0
                  errors.append(f'{src["id"]}: {e}')

          print('RSS source counts:', source_counts)
          if source_success == 0:
              raise SystemExit('NEWS: nijedan RSS izvor nije dao stavke. Feed se ne prebrisuje. '+' | '.join(errors))

          seen=set(); unique=[]
          for item in sorted(items,key=lambda x:x.get('date',''),reverse=True):
              key=item['link'].rstrip('/')
              if key in seen: continue
              seen.add(key)
              previous=old_by_link.get(key)
              if previous:
                  item['originalTitle']=previous.get('originalTitle',item['title'])
                  item['originalSummary']=previous.get('originalSummary',item['summary'])
              else:
                  item['originalTitle']=item['title']
                  item['originalSummary']=item['summary']
              item['editorialStatus']='rss'
              unique.append(item)

          data={
              'updatedAt':datetime.now(timezone.utc).isoformat(),
              'editorialModel':'rss-direct',
              'sourceCounts':source_counts,
              'items':unique[:200]
          }
          with open('news-feed.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print('PatriaSoul news:',len(unique[:200]),'items')
          if errors:
              print('RSS warnings:', ' | '.join(errors))

      - name: Provjeri feed prije spremanja
        shell: python
        run: |
          import json
          with open('news-feed.json',encoding='utf-8') as f:
              data=json.load(f)
          items=data.get('items',[])
          if not isinstance(items,list) or not items:
              raise SystemExit('NEWS QA: news-feed.json je prazan — commit se prekida.')
          required=('title','summary','link','source','category')
          bad=[i for i,x in enumerate(items) if not all(x.get(k) for k in required)]
          if bad:
              raise SystemExit('NEWS QA: neispravne stavke: '+str(bad[:20]))
          print('NEWS QA OK:',len(items),'vijesti')

      - name: Spremi osvježeni feed
        run: |
          git config user.name "patriasoul-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news-feed.json
          git diff --cached --quiet && exit 0
          git commit -m "Popravljeno automatsko osvježavanje PatriaSoul vijesti"
          git push
