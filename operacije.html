<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operacije i bojišta | PatriaSoul</title><meta name="description" content="Središnji registar važnijih hrvatskih vojno-redarstvenih i oslobodilačkih operacija."><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/patriasoul-global.css"><style>.registry{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.registry-card{padding:22px}.registry-card h2{margin:0 0 8px}.meta{color:var(--pt-muted);font-size:13px}.toolbar{margin:26px 0}.toolbar input{width:100%;padding:13px 15px}.tag{display:inline-block;margin-top:14px;padding:6px 9px;border:1px solid var(--pt-line);border-radius:999px;color:var(--pt-gold2);font-size:11px}.empty{padding:35px;text-align:center;color:var(--pt-muted)}@media(max-width:900px){.registry{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.registry{grid-template-columns:1fr}}</style><script src="/page-hero.js?v=38e52e479912" defer></script>
</head><body>
<header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html"><span class="ps-brand-mark">🇭🇷</span> PATRIA<span>SOUL</span></a><nav class="ps-mainnav"></nav><button class="ps-menu" data-ps-menu aria-label="Otvori izbornik">☰</button></div></header>
<main><section class="ps-page-hero"><div class="container"><p>BRANITELJI · POVIJEST · BOJIŠTA</p><h1>Operacije i bojišta</h1><p>Pregled važnijih operacija iz središnjeg registra PatriaSoula, uz naglasak na provjerljive povijesne podatke.</p></div></section><section class="container" style="padding:38px 0 70px"><div class="toolbar"><input id="search" type="search" placeholder="Pretraži operaciju, kodni naziv, područje ili razdoblje…" aria-label="Pretraži operacije"></div><div id="list" class="registry"></div></section></main><footer class="ps-footer"><div class="container"><p>PatriaSoul · Znanje, sjećanje i identitet.</p></div></footer>
<script src="/site-navigation.js"></script><script type="module">import {operacije} from '/operacije.js';const list=document.getElementById('list'),search=document.getElementById('search');function render(){const q=search.value.trim().toLowerCase();const rows=operacije.filter(x=>JSON.stringify(x).toLowerCase().includes(q));list.innerHTML=rows.map(x=>`<article class="registry-card ps-card"><h2>${x.naziv||x.name||'Operacija'}</h2><div class="meta">${x.kodniNaziv?'Kodni naziv: '+x.kodniNaziv:''}${x.datum?' · '+x.datum:''}</div><p>${x.opis||x.description||x.cilj||'Podaci o operaciji nalaze se u središnjem registru.'}</p><span class="tag">${x.podrucje||x.area||x.razdoblje||x.period||'Domovinski rat'}</span></article>`).join('')||'<div class="empty">Nema rezultata.</div>'}search.addEventListener('input',render);render();</script></body></html>
