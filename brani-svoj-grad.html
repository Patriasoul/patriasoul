<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Brani svoj grad – PatriaSoul gradski izazov znanja."><title>Brani svoj grad | PatriaSoul</title><link rel="stylesheet" href="patriasoul-modern.css"><style>.citypick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.citypick button{padding:15px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#11161d;color:#fff;text-align:left;cursor:pointer}.citypick button:hover{border-color:#d6ad55}.hidden{display:none}.shield{text-align:center;font-size:4rem}.game{max-width:850px;margin:auto}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answers button{padding:16px;border-radius:14px;background:#11161d;color:#fff;border:1px solid rgba(255,255,255,.12);cursor:pointer}.answers button.correct{outline:2px solid #39a96b}.answers button.wrong{outline:2px solid #c94b4b}@media(max-width:700px){.citypick,.answers{grid-template-columns:1fr}}</style></head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="index.html"><span class="ps-brand-mark">PS</span>PATRIA<span>SOUL</span></a><nav class="ps-mainnav"><a href="index.html">Početna</a><a href="gradovi.html">Gradovi</a><a href="brani-svoj-grad.html" aria-current="page">Igra</a><a href="rang-lista.html">Rang-lista</a><a class="ps-nav-cta" href="quiz.html">🧠 Kviz</a></nav></div></header><main><section class="ps-page-hero"><div class="container"><div class="ps-breadcrumbs"><a href="index.html">Početna</a> / Brani svoj grad</div><span class="ps-kicker">🛡️ Gradski izazov</span><h1>Brani svoj grad</h1><p>Izaberi grad koji želiš braniti. Dobivaš 5 pitanja iz PatriaSoul baze, a rezultat se pripisuje odabranom gradu.</p></div></section><section class="ps-section"><div class="container game"><div id="pick"><div class="shield">🛡️</div><h2>Odaberi svoj grad</h2><input id="search" type="search" placeholder="Pretraži grad…" style="width:100%;padding:14px;border-radius:12px;background:#11161d;color:#fff;border:1px solid #444;margin:10px 0 18px"><div id="cities" class="citypick"></div></div><div id="play" class="hidden"><p><a href="gradovi.html">← Svi gradovi</a></p><h2 id="title"></h2><p id="progress"></p><h3 id="question"></h3><div id="answers" class="answers"></div><p id="feedback"></p></div><div id="done" class="hidden" style="text-align:center"><div class="shield">🏆</div><h2 id="doneTitle"></h2><p id="doneScore"></p><a class="ps-btn" href="rang-lista.html">Vidi rang-listu</a></div></div></section></main><script src="gradovi.js"></script><script src="quiz.js"></script><script src="badges.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const $=id=>document.getElementById(id),cities=window.PATRIA_CITY_DATA||[];function render(q=''){const s=q.toLocaleLowerCase('hr-HR');$('cities').innerHTML=cities.filter(c=>!s||c.name.toLocaleLowerCase('hr-HR').includes(s)).map(c=>`<button data-city="${c.name.replace(/"/g,'&quot;')}"><strong>${c.name}</strong><br><small>${c.county}</small></button>`).join('');$('cities').querySelectorAll('button').forEach(b=>b.onclick=()=>start(b.dataset.city))}render();$('search').oninput=e=>render(e.target.value);let city,qs=[],i=0,score=0;function start(name){city=name;const seed=[...name].reduce((a,c)=>((a*31+c.charCodeAt(0))>>>0),17);qs=PatriaQuiz.seededShuffle(PatriaQuiz.bank(),seed).slice(0,5).map(q=>PatriaQuiz.prepare(q));i=score=0;$('pick').classList.add('hidden');$('play').classList.remove('hidden');show()}function show(){$('title').textContent='🛡️ Brani '+city;$('progress').textContent=`Pitanje ${i+1}/5`;$('question').textContent=qs[i].question;$('feedback').textContent='';$('answers').innerHTML=qs[i].options.map((o,n)=>`<button data-i="${n}">${String.fromCharCode(65+n)}) ${o.text}</button>`).join('');$('answers').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}function answer(n){const q=qs[i],bs=[...$('answers').children];bs.forEach(b=>b.disabled=true);if(n===q.correctIndex){score+=100;bs[n].classList.add('correct');$('feedback').textContent='+100 bodova'}else{bs[n]?.classList.add('wrong');bs[q.correctIndex].classList.add('correct');$('feedback').textContent='Točan odgovor: '+q.options[q.correctIndex].text}setTimeout(()=>{i++;i<5?show():finish()},700)}function finish(){const p=PatriaPlayer.current();p.cities=p.cities||{};p.cities[city]=Math.max(p.cities[city]||0,score);p.points=(p.points||0)+score;p.xp=(p.xp||0)+score;PatriaBadges.evaluate(p);localStorage.setItem('patriasoul_player',JSON.stringify(p));const key='patriasoul_city_scores',all=JSON.parse(localStorage.getItem(key)||'[]');all.push({city,score,name:p.name||'Gost',date:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(all));$('play').classList.add('hidden');$('done').classList.remove('hidden');$('doneTitle').textContent='Grad obranjen!';$('doneScore').textContent=`${city} · ${score}/500 bodova`}}</script></body></html>
