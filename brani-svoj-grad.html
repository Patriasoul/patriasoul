<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brani svoj grad | PatriaSoul</title><link rel="stylesheet" href="patriasoul-modern.css"><style>.game-wrap{max-width:1060px;margin:auto}.game-card{background:linear-gradient(145deg,#111821,#0a0e13);border:1px solid rgba(212,174,56,.22);border-radius:18px;padding:28px}.game-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.game-form label{display:block;margin-bottom:7px;color:var(--ps-muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px}.game-form input,.game-form select{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #303844;background:#080c11;color:#fff}.game-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}.game-status{margin-top:16px;color:#a8afb8}.challenge-box{margin-top:18px;padding:18px;border:1px solid rgba(212,174,56,.18);border-radius:14px;background:rgba(212,174,56,.04);display:none}.challenge-box.show{display:block}.mini-status{display:inline-block;margin-left:8px;font-size:12px;font-weight:800}.ok{color:#74d59b}.bad{color:#ef7b84}.quiz-panel{display:none;margin-top:24px}.quiz-panel.show{display:block}.quiz-top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px}.progress{height:8px;background:#222a34;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--ps-gold);width:0;transition:width .25s}.timer{font-size:22px;font-weight:900;color:var(--ps-gold-2);min-width:70px;text-align:right}.question{font-size:24px;font-weight:800;line-height:1.3;margin:22px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{padding:16px;text-align:left;border:1px solid #303844;border-radius:12px;background:#0c1117;color:#fff;font-size:16px;cursor:pointer}.answer:hover:not(:disabled){border-color:var(--ps-gold);transform:translateY(-1px)}.answer.correct{border-color:#39a873;background:rgba(57,168,115,.13)}.answer.wrong{border-color:#d9535f;background:rgba(217,83,95,.13)}.answer:disabled{cursor:default}.result{text-align:center;padding:25px}.score{font-size:48px;font-weight:950;color:var(--ps-gold-2)}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.versus{font-size:18px;font-weight:900;margin:4px 0 18px}.result-box{display:none;margin-top:24px;border-top:1px solid #2b333e;padding-top:20px}.result-box.show{display:block}@media(max-width:700px){.game-form,.answers{grid-template-columns:1fr}.question{font-size:20px}}</style></head><body><div id="site-header"></div><main><section class="ps-page-hero"><div class="container"><div class="ps-breadcrumbs"><a href="/index.html">Početna</a> / Brani svoj grad</div><span class="ps-kicker">🛡️ PatriaSoul izazov</span><h1>Brani svoj grad</h1><p>10 pitanja iz centralne PatriaSoul baze. Tvoj grad protiv izazova.</p></div></section><section class="ps-section"><div class="container game-wrap"><div class="game-card"><div id="setup"><div class="game-form"><div><label for="nickname">Nadimak</label><input id="nickname" maxlength="20" placeholder="Npr. HrvatskiLav"><div id="nicknameStatus" class="mini-status"></div></div><div><label for="city">Tvoj grad</label><select id="city"><option value="">Odaberi grad</option></select></div></div><div class="game-actions"><button class="ps-btn ps-btn-primary" id="start" type="button">🛡️ Započni misiju</button><button class="ps-btn ps-btn-ghost" id="challenge" type="button">⚔️ Izazovi drugi grad</button></div><div id="challengeBox" class="challenge-box"><h3>Grad protiv grada</h3><p>Odaberi protivnički grad:</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><select id="opponent" style="flex:1;min-width:220px;padding:13px 14px;border-radius:10px;border:1px solid #303844;background:#080c11;color:#fff"><option value="">Odaberi protivnika</option></select><button class="ps-btn ps-btn-primary" id="prepareChallenge" type="button">⚔️ Pokreni izazov</button></div></div><p class="game-status" id="status">Odaberi grad i nadimak.</p></div><div id="quizPanel" class="quiz-panel"><div class="quiz-top"><div style="flex:1"><div id="questionCount" style="font-weight:800;margin-bottom:7px"></div><div class="progress"><span id="progress"></span></div></div><div class="timer" id="timer">15</div></div><div class="versus" id="versus"></div><div class="question" id="question"></div><div class="answers" id="answers"></div></div><div id="resultBox" class="result-box"><div class="result"><div class="ps-kicker">🏆 Misija završena</div><h2 id="resultTitle"></h2><div class="score" id="score"></div><p id="resultDetails"></p><div class="result-actions"><button class="ps-btn ps-btn-primary" id="again" type="button">🔄 Igraj ponovno</button><button class="ps-btn ps-btn-ghost" id="newChallenge" type="button">⚔️ Novi izazov</button></div></div></div></div></div></section></main><div id="site-footer"></div>
<script src="gradovi.js"></script><script src="quiz.js"></script><script src="app.js" defer></script><script>
(function(){'use strict';const $=id=>document.getElementById(id);const cities=Array.isArray(window.PATRIA_CITIES)?window.PATRIA_CITIES:[];const city=$('city'),opp=$('opponent'),nick=$('nickname');cities.forEach(name=>{let o=document.createElement('option');o.value=name;o.textContent=name;city.appendChild(o);o=o.cloneNode(true);opp.appendChild(o)});function valid(n){return /^[A-Za-z0-9ČĆŽŠĐčćžšđ _-]{3,20}$/.test(n)}function playerOk(n){if(!window.PatriaPlayer)return valid(n);return window.PatriaPlayer.choose(n).ok}nick.oninput=()=>{const n=nick.value.trim();if(!n){$('nicknameStatus').textContent='';return}const ok=valid(n);$('nicknameStatus').textContent=ok?'Nadimak je valjan ✓':'Nadimak mora imati 3–20 znakova.';$('nicknameStatus').className='mini-status '+(ok?'ok':'bad')};let g={items:[],i:0,score:0,correct:0,sec:15,timer:null,own:'',enemy:'',name:''};function start(enemy=''){const name=nick.value.trim(),own=city.value;if(!valid(name)||!own){$('status').textContent='Unesi valjan nadimak i odaberi grad.';return}if(enemy&&enemy===own){$('status').textContent='Protivnički grad mora biti različit.';return}if(window.PatriaPlayer){const r=window.PatriaPlayer.choose(name);if(!r.ok){$('status').textContent=r.error;return}}const bank=window.PatriaQuiz&&typeof window.PatriaQuiz.bank==='function'?window.PatriaQuiz.bank():[];if(bank.length<10){$('status').textContent='Baza pitanja nije spremna.';return}g={items:window.PatriaQuiz.byCategory('mijesani',10),i:0,score:0,correct:0,sec:15,timer:null,own,enemy,name};$('setup').style.display='none';$('resultBox').classList.remove('show');$('quizPanel').classList.add('show');render()}function render(){const q=g.items[g.i];if(!q)return finish();$('questionCount').textContent=`Pitanje ${g.i+1} / 10`;$('progress').style.width=(g.i/10*100)+'%';$('versus').textContent=g.enemy?`${g.own} ⚔️ ${g.enemy}`:`🛡️ ${g.own}`;$('question').textContent=q.q;const box=$('answers');box.innerHTML='';q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.type='button';b.textContent=`${String.fromCharCode(65+i)}. ${o.text}`;b.onclick=()=>answer(i,b);box.appendChild(b)});clearInterval(g.timer);g.sec=15;$('timer').textContent='15';g.timer=setInterval(()=>{g.sec--;$('timer').textContent=g.sec;if(g.sec<=0){clearInterval(g.timer);answer(-1,null)}},1000)}function answer(choice,button){clearInterval(g.timer);const q=g.items[g.i],all=document.querySelectorAll('.answer');all.forEach(b=>b.disabled=true);if(choice===q.correctIndex){g.correct++;g.score+=100+g.sec*5;if(button)button.classList.add('correct')}else{if(button)button.classList.add('wrong');if(all[q.correctIndex])all[q.correctIndex].classList.add('correct')}setTimeout(()=>{g.i++;render()},650)}function finish(){clearInterval(g.timer);$('progress').style.width='100%';$('quizPanel').classList.remove('show');$('resultBox').classList.add('show');const pct=Math.round(g.correct/10*100);$('resultTitle').textContent=g.enemy?`${g.own} ⚔️ ${g.enemy}`:`${g.own} — misija završena`;$('score').textContent=g.score+' bodova';$('resultDetails').textContent=`Točnih odgovora: ${g.correct}/10 (${pct}%). Osvojeni XP: ${g.score}.`;const p=window.PatriaPlayer?window.PatriaPlayer.current():{};if(p){p.xp=(p.xp||0)+g.score;p.points=(p.points||0)+g.score;p.quizzes=(p.quizzes||0)+1;p.correct=(p.correct||0)+g.correct;try{localStorage.setItem('patriasoul_player',JSON.stringify(p));localStorage.setItem('patriasoul_profile',JSON.stringify(p))}catch(e){}}}function reset(){ $('setup').style.display='block';$('resultBox').classList.remove('show');$('challengeBox').classList.remove('show');$('status').textContent='Odaberi grad i pokreni novu misiju.'}$('start').onclick=()=>start();$('challenge').onclick=()=>$('challengeBox').classList.toggle('show');$('prepareChallenge').onclick=()=>{if(!city.value||!opp.value){$('status').textContent='Odaberi svoj i protivnički grad.';return}start(opp.value)};$('again').onclick=()=>start(g.enemy);$('newChallenge').onclick=reset;})();</script></body></html>
