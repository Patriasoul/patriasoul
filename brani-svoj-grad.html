<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Brani svoj grad — PatriaSoul gradski izazov znanja."><title>Brani svoj grad | PatriaSoul</title><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/patriasoul-global.css"><script src="/site-navigation.js" defer></script></head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html">PATRIA<span>SOUL</span></a><nav class="ps-mainnav"></nav><button class="ps-menu" data-ps-menu type="button" aria-label="Otvori izbornik" aria-expanded="false">☰</button></div></header><main><section class="ps-page-hero"><div class="container"><span class="ps-kicker">🛡️ GRADSKI IZAZOV</span><h1>Brani svoj grad</h1><p>Odaberi grad, odgovori na pet pitanja i osvoji do 500 bodova.</p></div></section><section class="ps-section"><div class="container"><div id="cityList"></div><div id="cityPlay" hidden></div><div id="cityDone" hidden></div></div></section></main><script src="/gradovi.js"></script><script src="/patriasoul-profile.js"></script><script src="/levels.js"></script><script src="/badges.js"></script><script src="/quiz.js"></script><script src="/patriasoul-city-questions.js"></script><script src="/patriasoul-city-questions-verified.js"></script><script src="/patriasoul-city-questions-verified-2.js"></script><script src="/patriasoul-city-questions-verified-3.js"></script><script src="/patriasoul-city-questions-verified-4.js"></script><script src="/patriasoul-city-questions-verified-5.js"></script><script src="/patriasoul-city-questions-verified-6.js"></script><script src="/patriasoul-city-questions-verified-7.js"></script><script src="/patriasoul-city-questions-verified-8.js"></script><script src="/patriasoul-city-questions-verified-9.js"></script><script src="/patriasoul-city-questions-verified-10.js"></script><script src="/patriasoul-city-questions-verified-11.js"></script><script src="/patriasoul-city-questions-verified-12.js"></script><script src="/patriasoul-city-questions-verified-13.js"></script><script src="/patriasoul-city-questions-verified-14.js"></script><script src="/patriasoul-city-questions-verified-15.js"></script><script src="/patriasoul-city-questions-verified-16.js"></script><script src="/patriasoul-city-questions-verified-17.js"></script><script src="/patriasoul-city-questions-verified-18.js"></script><script src="/patriasoul-city-questions-verified-19.js"></script><script src="/patriasoul-city-questions-verified-20.js"></script><script src="/patriasoul-city-game.js"></script><script>(function(){'use strict';const $=id=>document.getElementById(id),cities=window.PATRIA_CITY_DATA||[];let city='',qs=[],pos=0,points=0,correct=0;const css='.city-game{max-width:980px;margin:auto}.city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.city-btn,.city-answer{width:100%;padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:#151b23;color:#fff;font:inherit;text-align:left;cursor:pointer}.city-btn strong{display:block}.city-btn small{opacity:.65}.city-btn:hover,.city-answer:hover{border-color:#d6ad55}.city-panel{background:linear-gradient(145deg,#141a22,#0b0f14);border-radius:24px;padding:28px}.city-answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.city-answer{min-height:72px}.city-answer.correct{border-color:#39a96b}.city-answer.wrong{border-color:#c94b4b}.city-bar{height:8px;background:#252b33;border-radius:9px;overflow:hidden;margin:16px 0}.city-bar i{display:block;height:100%;background:#d6ad55;width:0}.city-score{font-size:5rem;font-weight:900;text-align:center;color:#d6ad55}.city-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}@media(max-width:700px){.city-grid,.city-answers{grid-template-columns:1fr}}';const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);function render(){$('cityList').innerHTML='<div class="city-game"><input id="citySearch" type="search" placeholder="🔎 Pretraži grad…" aria-label="Pretraži grad" style="width:100%;box-sizing:border-box;padding:15px;margin-bottom:18px"><div class="city-grid" id="cityGrid"></div></div>';const grid=$('cityGrid');function draw(f=''){f=f.toLocaleLowerCase('hr-HR').trim();grid.innerHTML=cities.filter(c=>!f||c.name.toLocaleLowerCase('hr-HR').includes(f)||c.county.toLocaleLowerCase('hr-HR').includes(f)).map(c=>`<button class="city-btn" type="button" data-city="${c.name.replace(/"/g,'&quot;')}"><strong>${c.name}</strong><small>${c.county}</small></button>`).join('')||'<p>Nema pronađenog grada.</p>';grid.querySelectorAll('.city-btn').forEach(b=>b.onclick=()=>start(b.dataset.city))}$('citySearch').oninput=e=>draw(e.target.value);draw()}function start(name){city=name;qs=PatriaCityGame.start(name).slice(0,5);pos=0;points=0;correct=0;$('cityList').hidden=true;$('cityDone').hidden=true;$('cityPlay').hidden=false;show()}function show(){const q=qs[pos];$('cityPlay').innerHTML=`<div class="city-game city-panel"><strong>🛡️ ${city}</strong><span style="float:right">Pitanje ${pos+1}/${qs.length}</span><div class="city-bar"><i style="width:${pos/qs.length*100}%"></i></div><h2>${q.question}</h2><div class="city-answers">${q.options.map((o,i)=>`<button class="city-answer" data-i="${i}" type="button">${String.fromCharCode(65+i)}) ${o.text}</button>`).join('')}</div><p id="feedback" aria-live="polite"></p><div class="city-actions"><button id="quit" class="ps-btn ps-btn-ghost" type="button">← Promijeni grad</button></div></div>`;$('cityPlay').querySelectorAll('.city-answer').forEach(b=>b.onclick=()=>answer(+b.dataset.i));$('quit').onclick=reset}function answer(i){const q=qs[pos],bs=[...$('cityPlay').querySelectorAll('.city-answer')];bs.forEach(b=>b.disabled=true);if(i===q.correctIndex){points+=100;correct++;bs[i].classList.add('correct');$('feedback').textContent='+100 bodova — točan odgovor!'}else{bs[i].classList.add('wrong');bs[q.correctIndex].classList.add('correct');$('feedback').textContent='Točan odgovor: '+q.options[q.correctIndex].text}setTimeout(()=>{pos++;pos<qs.length?show():finish()},650)}function finish(){const r=PatriaCityGame.finish(city,points,correct);$('cityPlay').hidden=true;$('cityDone').hidden=false;$('cityDone').innerHTML=`<div class="city-game city-panel"><div class="city-score">${r.score}</div><h2 style="text-align:center">Grad je obranjen!</h2><p style="text-align:center">${r.correct}/5 točnih odgovora — ${city}</p><div class="city-actions"><button id="again" class="ps-btn" type="button">Igraj ponovno</button><a class="ps-btn ps-btn-ghost" href="/rang-lista.html">Rang-lista</a><a class="ps-btn ps-btn-ghost" href="/gradovi.html">Svi gradovi</a></div></div>`;$('again').onclick=()=>start(city)}function reset(){city='';$('cityPlay').hidden=true;$('cityDone').hidden=true;$('cityList').hidden=false;render()}render()})();</script></body></html>
