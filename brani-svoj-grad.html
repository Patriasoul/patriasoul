<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Brani svoj grad — PatriaSoul izazov znanja."><title>Brani svoj grad | PatriaSoul</title><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><style>.citypick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.citypick button,.answers button{padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#11161d;color:#fff;text-align:left;cursor:pointer;font:inherit}.citypick button:hover,.answers button:hover{border-color:#d6ad55}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answers button.correct{outline:2px solid #39a96b}.answers button.wrong{outline:2px solid #c94b4b}.hidden{display:none}.game{max-width:900px;margin:auto}.shield{text-align:center;font-size:4rem}@media(max-width:700px){.citypick,.answers{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/patriasoul-global.css">
</head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html"><span class="ps-brand-mark">PS</span>PATRIA<span>SOUL</span></a><nav class="ps-mainnav"><a href="/index.html">Početna</a><a href="/gradovi.html">Gradovi</a><a href="/quiz.html">Kviz</a><a href="/brani-svoj-grad.html" aria-current="page">Igra</a><a href="/rang-lista.html">Rang-lista</a><a href="/profil.html">Profil</a></nav><button class="ps-menu" data-ps-menu aria-label="Izbornik">☰</button></div></header><main><section class="ps-page-hero"><div class="container"><span class="ps-kicker">🛡️ Gradski izazov</span><h1>Brani svoj grad</h1><p>Odaberi jedan od 127 gradova. Pet pitanja, do 500 bodova i rezultat koji se bilježi u tvom profilu.</p></div></section><section class="ps-section"><div class="container game"><div id="pick"><div class="shield">🛡️</div><h2>Odaberi grad</h2><input id="search" type="search" placeholder="Pretraži grad…" aria-label="Pretraži grad" style="width:100%;padding:14px;border-radius:12px;background:#11161d;color:#fff;border:1px solid #444;margin:10px 0 18px"><div id="cities" class="citypick"></div></div><div id="play" class="hidden"><p><a href="/gradovi.html">← Svi gradovi</a></p><h2 id="title"></h2><p id="progress"></p><h3 id="question"></h3><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p></div><div id="done" class="hidden" style="text-align:center"><div class="shield">🏆</div><h2>Grad obranjen!</h2><p id="doneScore"></p><a class="ps-btn" href="/rang-lista.html">Vidi rang-listu</a></div></div></section></main><script src="/gradovi.js"></script><script src="/patriasoul-profile.js"></script><script src="/levels.js"></script><script src="/badges.js"></script><script src="/quiz.js"></script><script src="/patriasoul-city-game.js"></script><script>(function(){const $=id=>document.getElementById(id),cities=window.PATRIA_CITY_DATA||[];let city,qs=[],i=0,score=0,correct=0;function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}function render(q=''){const s=q.toLocaleLowerCase('hr-HR');$('cities').innerHTML=cities.filter(c=>!s||c.name.toLocaleLowerCase('hr-HR').includes(s)).map(c=>`<button data-city="${esc(c.name)}"><strong>${esc(c.name)}</strong><br><small>${esc(c.county)}</small></button>`).join('');$('cities').querySelectorAll('button').forEach(b=>b.onclick=()=>start(b.dataset.city))}function start(n){city=n;qs=PatriaCityGame.start(n);i=0;score=0;correct=0;$('pick').classList.add('hidden');$('play').classList.remove('hidden');show()}function show(){$('title').textContent='🛡️ Brani '+city;$('progress').textContent=`Pitanje ${i+1}/5`;$('question').textContent=qs[i].question;$('feedback').textContent='';$('answers').innerHTML=qs[i].options.map((o,n)=>`<button data-i="${n}">${String.fromCharCode(65+n)}) ${esc(o.text)}</button>`).join('');$('answers').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}function answer(n){const q=qs[i],bs=[...$('answers').children];bs.forEach(b=>b.disabled=true);if(n===q.correctIndex){score+=100;correct++;bs[n].classList.add('correct');$('feedback').textContent='+100 bodova'}else{bs[n]?.classList.add('wrong');bs[q.correctIndex].classList.add('correct');$('feedback').textContent='Točan odgovor: '+q.options[q.correctIndex].text}setTimeout(()=>{i++;i<5?show():finish()},500)}function finish(){const r=PatriaCityGame.finish(city,score,correct);$('play').classList.add('hidden');$('done').classList.remove('hidden');$('doneScore').textContent=`${city} · ${r.correct}/5 · ${r.score}/500 bodova`;}render();$('search').oninput=e=>render(e.target.value);document.querySelector('[data-ps-menu]')?.addEventListener('click',()=>document.querySelector('.ps-mainnav')?.classList.toggle('is-open'));})();</script></body></html>
