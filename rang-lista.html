<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PatriaSoul rang-lista — poredak prema XP-u i bodovima."><title>Rang-lista | PatriaSoul</title><link rel="stylesheet" href="patriasoul-modern.css"><style>.rank{max-width:900px;margin:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{padding:11px 15px;border-radius:10px;border:1px solid #444;background:#11161d;color:#fff;cursor:pointer}.tabs button.active{border-color:#d6ad55}.row{display:grid;grid-template-columns:55px 1fr 120px 120px 100px;gap:10px;align-items:center;padding:14px;border-bottom:1px solid rgba(255,255,255,.08)}.row:first-child{border-radius:12px 12px 0 0}@media(max-width:650px){.row{grid-template-columns:40px 1fr 85px;font-size:.92rem}.row .optional{display:none}}.rank-note{margin:0 0 18px}.rank-card{overflow:hidden}</style></head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="index.html"><span class="ps-brand-mark">PS</span>PATRIA<span>SOUL</span></a><nav class="ps-mainnav"><a href="index.html">Početna</a><a href="gradovi.html">Gradovi</a><a href="brani-svoj-grad.html">Igra</a><a href="rang-lista.html" aria-current="page">Rang-lista</a><a href="profil.html">Profil</a><a class="ps-nav-cta" href="quiz.html">🧠 Kviz</a></nav><button class="ps-menu" type="button" data-ps-menu>☰</button></div></header><main><section class="ps-page-hero"><div class="container"><div class="ps-breadcrumbs"><a href="index.html">Početna</a> / Rang-lista</div><span class="ps-kicker">🏆 PatriaSoul natjecanje</span><h1>Rang-lista</h1><p>Prati poredak prema XP-u, bodovima i odigranim kvizovima.</p></div></section><section class="ps-section"><div class="container rank"><div class="tabs"><button class="active" data-type="xp">⭐ XP</button><button data-type="points">🏆 Bodovi</button><button data-type="quiz">🧠 Kviz</button><button data-type="city">🛡️ Grad</button></div><div class="ps-card rank-card"><p class="rank-note small" id="note"></p><div id="list"></div><p id="empty" class="small"></p></div></div></section></main><script src="xp-engine.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const list=document.getElementById('list'),empty=document.getElementById('empty'),note=document.getElementById('note');let type='xp';function profile(){try{return JSON.parse(localStorage.getItem('patriasoul_xp')||'{}')}catch{return{}}}function draw(){const p=profile();let rows=[];if(type==='xp'||type==='points'){rows=[{name:'Ti',xp:Number(p.xp)||0,points:Number(p.points)||0,quizzes:Number(p.quizzes)||0}];try{const saved=JSON.parse(localStorage.getItem('patriasoul_leaderboard')||'[]');rows=rows.concat(Array.isArray(saved)?saved:[])}catch{}}else if(type==='quiz'){Object.keys(localStorage).filter(k=>k.startsWith('patriasoul_score_')).forEach(k=>{try{const x=JSON.parse(localStorage.getItem(k));rows.push({name:x.name||'Gost',points:x.points||0,quizzes:1,extra:`${x.correct||0}/${x.total||0}`})}catch{}})}else{try{rows=JSON.parse(localStorage.getItem('patriasoul_city_scores')||'[]').map(x=>({name:x.city||'Grad',points:x.score||0,quizzes:0,extra:x.name||'Gost'}))}catch{}}const seen={};rows.forEach(x=>{const n=x.name||'Gost';if(!seen[n]||Number(x.xp||0)>Number(seen[n].xp||0)||Number(x.points||0)>Number(seen[n].points||0))seen[n]=x});rows=Object.values(seen);rows.sort((a,b)=>type==='xp'?(b.xp||0)-(a.xp||0):(b.points||0)-(a.points||0));list.innerHTML=rows.slice(0,50).map((x,i)=>`<div class="row"><strong>${i<3?['🥇','🥈','🥉'][i]:i+1}</strong><span>${x.name||'Gost'}</span><strong>${type==='xp'?(x.xp||0)+' XP':(x.points||0)+' bod'}</strong><span class="optional">${x.quizzes||0} kviz.</span><span class="optional">${x.extra||''}</span></div>`).join('');empty.textContent=rows.length?'Prikazano je do 50 najboljih rezultata.':'Još nema rezultata na ovom uređaju.';note.textContent='Trenutno lokalna rang-lista. Kada uvedemo korisnički račun i bazu, ista stranica može postati javna rang-lista za sve igrače.'}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;draw()});document.querySelector('[data-ps-menu]')?.addEventListener('click',()=>document.querySelector('.ps-mainnav')?.classList.toggle('is-open'));draw()})</script><script src="/ai-engine/puter-ai.js"></script><script src="/ai-engine/pitaj-patriasoul-widget.js"></script></body></html>
