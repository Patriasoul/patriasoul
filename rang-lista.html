<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rang-lista | PatriaSoul</title><link rel="stylesheet" href="patriasoul-modern.css"><style>.rank{max-width:850px;margin:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{padding:11px 15px;border-radius:10px;border:1px solid #444;background:#11161d;color:#fff;cursor:pointer}.tabs button.active{border-color:#d6ad55}.row{display:grid;grid-template-columns:55px 1fr 120px 100px;gap:10px;align-items:center;padding:14px;border-bottom:1px solid rgba(255,255,255,.08)}.row:first-child{border-radius:12px 12px 0 0}@media(max-width:600px){.row{grid-template-columns:40px 1fr 90px;font-size:.92rem}.row span:last-child{display:none}}</style></head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="index.html"><span class="ps-brand-mark">PS</span>PATRIA<span>SOUL</span></a><nav class="ps-mainnav"><a href="index.html">Početna</a><a href="gradovi.html">Gradovi</a><a href="brani-svoj-grad.html">Igra</a><a href="rang-lista.html" aria-current="page">Rang-lista</a><a class="ps-nav-cta" href="quiz.html">🧠 Kviz</a></nav></div></header><main><section class="ps-page-hero"><div class="container"><div class="ps-breadcrumbs"><a href="index.html">Početna</a> / Rang-lista</div><span class="ps-kicker">🏆 PatriaSoul natjecanje</span><h1>Rang-lista</h1><p>Rezultati se trenutno spremaju lokalno na uređaju. Kasnije ih možemo spojiti na pravi korisnički sustav i javnu bazu.</p></div></section><section class="ps-section"><div class="container rank"><div class="tabs"><button class="active" data-type="quiz">Kviz</button><button data-type="city">Brani svoj grad</button></div><div id="list"></div><p id="empty" class="small"></p></div></section></main><script>document.addEventListener('DOMContentLoaded',()=>{const list=document.getElementById('list'),empty=document.getElementById('empty');let type='quiz';function draw(){let rows=[];if(type==='quiz'){Object.keys(localStorage).filter(k=>k.startsWith('patriasoul_score_')).forEach(k=>{try{const x=JSON.parse(localStorage.getItem(k));rows.push({name:x.name||'Gost',score:x.points||0,extra:`${x.correct||0}/${x.total||0}`})}catch{}})}else{try{rows=JSON.parse(localStorage.getItem('patriasoul_city_scores')||'[]').map(x=>({name:x.city,score:x.score,extra:x.name||'Gost'}))}catch{}}rows.sort((a,b)=>b.score-a.score);list.innerHTML=rows.slice(0,50).map((x,i)=>`<div class="row"><strong>${i+1}</strong><span>${x.name}</span><strong>${x.score}</strong><span>${x.extra}</span></div>`).join('');empty.textContent=rows.length?'Prikazano je do 50 najboljih lokalnih rezultata.':'Još nema rezultata na ovom uređaju.'}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;draw()});draw()})</script></body></html>
