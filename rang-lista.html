<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PatriaSoul javna rang-lista — dnevni, tjedni, mjesečni i ukupni poredak."><meta name="theme-color" content="#c9a227"><link rel="manifest" href="/manifest.json"><title>Rang-lista | PatriaSoul</title><link rel="stylesheet" href="/variables.css"><link rel="stylesheet" href="/patriasoul-modern.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/patriasoul-global.css"><link rel="stylesheet" href="/responsive.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><script src="/site-navigation.js?v=41" defer></script></head><body><header class="ps-header"><div class="container ps-nav"><a class="ps-brand" href="/index.html"><span class="ps-brand-mark">PS</span>PATRIA<span>SOUL</span></a><nav class="ps-mainnav"></nav><button class="ps-menu" data-ps-menu type="button" aria-label="Izbornik" aria-expanded="false">☰</button></div></header><main><section class="ps-page-hero"><div class="container"><span class="ps-kicker">🏆 NATJECANJE</span><h1>Rang-lista</h1><p>Prati najbolje igrače i svoj napredak kroz dnevni, tjedni, mjesečni i ukupni poredak.</p></div></section><section class="ps-section"><div class="container"><div class="ps-tabs" role="tablist"><button class="ps-btn" data-period="daily">Danas</button><button class="ps-btn" data-period="weekly">Tjedan</button><button class="ps-btn" data-period="monthly">Mjesec</button><button class="ps-btn" data-period="all">Ukupno</button></div><div id="leaderboard" class="ps-card" style="margin-top:18px;overflow:hidden"></div><p id="rank-note" class="ps-muted" style="margin-top:12px"></p></div></section></main><script src="/patriasoul-profile.js"></script><script src="/leaderboard.js"></script><script>const box=document.getElementById('leaderboard'),note=document.getElementById('rank-note');let active='daily';async function render(){box.innerHTML='<div style="padding:24px"><p>Učitavanje rang-liste…</p></div>';const rows=await PatriaLeaderboard.aggregate('points',active);if(!rows.length){box.innerHTML='<div style="padding:24px"><h2>Još nema rezultata</h2><p>Odigraj kviz i zauzmi svoje mjesto na ljestvici.</p></div>';note.textContent=PatriaLeaderboard.remote()?'Javna rang-lista je aktivna.':'Prikazani su lokalni rezultati ovog uređaja dok Supabase nije konfiguriran.';return}box.innerHTML='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>#</th><th>Igrač</th><th>Bodovi</th><th>XP</th><th>Kvizovi</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td style="padding:12px">'+(r.rank||i+1)+'</td><td style="padding:12px;font-weight:700">'+String(r.username||r.name||'Igrač').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</td><td style="padding:12px">'+Number(r.points||0)+'</td><td style="padding:12px">'+Number(r.xp||0)+'</td><td style="padding:12px">'+Number(r.quizzes||0)+'</td></tr>').join('')+'</tbody></table></div>';note.textContent=PatriaLeaderboard.remote()?'Javna rang-lista — Supabase backend.':'Lokalni način rada.'}document.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));render();</script></body></html>
